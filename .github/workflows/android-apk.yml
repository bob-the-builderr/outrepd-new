# Builds OUTREPD for Android on GitHub's machines — the APK for a phone and
# the App Bundle for Google Play — so a release does not depend on the local
# disk that holds Flutter and Gradle. Also runs the checks, and publishes what
# they found where a git fetch can read it.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY   required — the same two lines as
#                                     apps/outrepd_flutter/supabase/keys.env.
#                                     Without them the job fails rather than
#                                     build an app that opens with no server,
#                                     which is exactly what shipped once.
#   REVENUECAT_ANDROID_KEY            RevenueCat's public Google Play key
#                                     (goog_...). Without it the build has no
#                                     paywall; the run says so in a warning.
#   UPLOAD_KEYSTORE_BASE64            the upload keystore (.jks), as base64.
#   UPLOAD_KEYSTORE_PASSWORD          its password.
#   UPLOAD_KEY_ALIAS                  the key's alias ("upload").
#   UPLOAD_KEY_PASSWORD               optional: the keystore password is used
#                                     when unset (a PKCS12 keystore has one).
#     With the upload key, both files are signed with it and an App Bundle is
#     built for Play. Without it the APK is signed with a throwaway debug key —
#     a new one every run, so each APK replaces the last only by uninstalling
#     it first — and there is no App Bundle.
#
# Both files are under "Artifacts" on the run's page. Every run numbers its
# build 100 + the run number, so each upload to Play is higher than the last.
#
# Results land on two branches that a `git fetch` can read without signing in
# to GitHub: `ci-results` (analyzer, tests, screenshots — one folder per
# commit) and `ci-builds` (what the build job made, and with which key).

name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [camera-rep-counter, camera-rep-counter-zzqfhq]
    paths:
      - 'apps/outrepd_flutter/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/outrepd_flutter

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
      UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to build without the server keys
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_ANON_KEY as repository secrets (Settings > Secrets and variables > Actions). An app built without them has no server."
            exit 1
          fi
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > supabase/keys.env
          if [ -n "$REVENUECAT_ANDROID_KEY" ]; then
            printf 'REVENUECAT_ANDROID_KEY=%s\n' "$REVENUECAT_ANDROID_KEY" >> supabase/keys.env
          else
            echo "::warning::No REVENUECAT_ANDROID_KEY secret: this build has no paywall, and the whole app is open."
          fi

      # android/key.properties is what android/app/build.gradle.kts reads. It
      # only ever exists on this machine, for this run.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Never fails the run: a key that cannot be used is reported — in the
      # warning and in the ci-builds report — and the APK is built unsigned,
      # so there is always something to install and a reason to read. None of
      # this prints a secret, only whether each one worked.
      - name: The upload key
        id: key
        run: |
          note() { echo "note=$1" >> "$GITHUB_OUTPUT"; echo "::warning::$1"; }
          missing=""
          [ -z "$UPLOAD_KEYSTORE_BASE64" ] && missing="$missing UPLOAD_KEYSTORE_BASE64"
          [ -z "$UPLOAD_KEYSTORE_PASSWORD" ] && missing="$missing UPLOAD_KEYSTORE_PASSWORD"
          [ -z "$UPLOAD_KEY_ALIAS" ] && missing="$missing UPLOAD_KEY_ALIAS"
          if [ -n "$missing" ]; then
            note "No upload key: missing secret(s)$missing. The APK is signed with a throwaway debug key and there is no App Bundle."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chars=$(printf '%s' "$UPLOAD_KEYSTORE_BASE64" | tr -d '\r\n ' | wc -c)
          if ! printf '%s' "$UPLOAD_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/upload.jks" 2>/dev/null; then
            note "UPLOAD_KEYSTORE_BASE64 is not a base64 keystore ($chars characters; a real one is about 3,600). Paste it again."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$UPLOAD_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/list.txt" 2>&1; then
            note "The keystore does not open with UPLOAD_KEYSTORE_PASSWORD ($chars characters of keystore decoded). Check the password secret — it is the one typed into keytool."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$UPLOAD_KEYSTORE_PASSWORD" -alias "$UPLOAD_KEY_ALIAS" > /dev/null 2>&1; then
            note "The keystore opens, but has no key called '$UPLOAD_KEY_ALIAS'. UPLOAD_KEY_ALIAS should be: upload"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$UPLOAD_KEYSTORE_PASSWORD" "$UPLOAD_KEY_ALIAS" \
            "${UPLOAD_KEY_PASSWORD:-$UPLOAD_KEYSTORE_PASSWORD}" > android/key.properties
          echo "note=the upload key opens and has the alias" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Both flags are required; see docs/building.md.
      - name: APK
        id: apk
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define-from-file=supabase/keys.env \
            --build-number=$((GITHUB_RUN_NUMBER + 100))

      - name: Check the server address is inside the APK
        run: |
          host="${SUPABASE_URL#https://}"
          host="${host%%/*}"
          apk=build/app/outputs/flutter-apk/app-release.apk
          if ! unzip -p "$apk" lib/arm64-v8a/libapp.so | grep -a -q -F "$host"; then
            echo "::error::The APK does not contain the Supabase address; it would open with no server."
            exit 1
          fi
          cp "$apk" "$RUNNER_TEMP/OUTREPD.apk"
          echo "Server address found in the APK."

      - name: App Bundle for Google Play
        id: aab
        if: steps.key.outputs.signed == 'true'
        run: |
          flutter build appbundle --release --no-tree-shake-icons \
            --dart-define-from-file=supabase/keys.env \
            --build-number=$((GITHUB_RUN_NUMBER + 100))
          aab=build/app/outputs/bundle/release/app-release.aab
          # Signed with the upload key, not a debug one: Play refuses those.
          keytool -printcert -jarfile "$aab" > "$RUNNER_TEMP/cert.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/cert.txt"; then
            echo "::error::The App Bundle is signed with a debug key; Google Play would refuse it."
            exit 1
          fi
          host="${SUPABASE_URL#https://}"
          host="${host%%/*}"
          if ! unzip -p "$aab" base/lib/arm64-v8a/libapp.so | grep -a -q -F "$host"; then
            echo "::error::The App Bundle does not contain the Supabase address."
            exit 1
          fi
          cp "$aab" "$RUNNER_TEMP/OUTREPD.aab"

      # Named after the commit, so a downloaded file says which code it is.
      - uses: actions/upload-artifact@v4
        with:
          name: OUTREPD-apk-${{ github.sha }}
          path: ${{ runner.temp }}/OUTREPD.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'true'
        with:
          name: OUTREPD-aab-${{ github.sha }}
          path: ${{ runner.temp }}/OUTREPD.aab
          retention-days: 30

      - name: Publish what was built to the ci-builds branch
        if: always()
        working-directory: .
        run: |
          out="$RUNNER_TEMP/build-report"
          mkdir -p "$out"
          apk="$RUNNER_TEMP/OUTREPD.apk"
          aab="$RUNNER_TEMP/OUTREPD.aab"
          {
            echo "commit      ${GITHUB_SHA}"
            echo "build       $((GITHUB_RUN_NUMBER + 100))"
            echo "upload key  ${{ steps.key.outputs.signed }}"
            echo "key note    ${{ steps.key.outputs.note }}"
            echo "apk         ${{ steps.apk.outcome }} $( [ -f "$apk" ] && stat -c %s "$apk" ) bytes"
            echo "aab         ${{ steps.aab.outcome }} $( [ -f "$aab" ] && stat -c %s "$aab" ) bytes"
            echo "paywall key $( [ -n "$REVENUECAT_ANDROID_KEY" ] && echo yes || echo no )"
            if [ -f "$RUNNER_TEMP/cert.txt" ]; then
              echo "signed by   $(grep -m1 'Owner:' "$RUNNER_TEMP/cert.txt")"
              echo "sha-256     $(grep -m1 'SHA256:' "$RUNNER_TEMP/cert.txt" | sed 's/.*SHA256: //')"
            fi
            echo "run         ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$out/summary.txt"

          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          work="$RUNNER_TEMP/builds"
          if git fetch --depth 1 origin ci-builds 2>/dev/null; then
            git worktree add "$work" FETCH_HEAD
            git -C "$work" checkout -B ci-builds
          else
            git worktree add --detach "$work"
            git -C "$work" checkout --orphan ci-builds
            git -C "$work" rm -rf -q . || true
          fi
          mkdir -p "$work/${GITHUB_SHA::7}" "$work/latest"
          cp "$out/summary.txt" "$work/${GITHUB_SHA::7}/summary.txt"
          cp "$out/summary.txt" "$work/latest/summary.txt"
          git -C "$work" add -A
          git -C "$work" commit -q -m "Build ${GITHUB_SHA::7}" || true
          git -C "$work" push -q origin ci-builds

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/ci"
          set -o pipefail
          flutter analyze 2>&1 | tee "$RUNNER_TEMP/ci/analyze.txt"

      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/ci/test.txt"

      - name: Screenshots
        id: shots
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/fonts"
          curl -sSL -o "$RUNNER_TEMP/fonts/NotoSans.ttf" \
            "https://github.com/google/fonts/raw/main/ofl/notosans/NotoSans%5Bwdth,wght%5D.ttf"
          SHOT_FONTS="$RUNNER_TEMP/fonts" flutter test --update-goldens tool/screenshots/ 2>&1 | tee "$RUNNER_TEMP/ci/screenshots.txt"

      - name: Publish the results to the ci-results branch
        if: always()
        working-directory: .
        run: |
          out="$RUNNER_TEMP/ci"
          mkdir -p "$out/screens"
          cp apps/outrepd_flutter/tool/screenshots/goldens/*.png "$out/screens/" 2>/dev/null || true
          {
            echo "commit   ${GITHUB_SHA}"
            echo "branch   ${GITHUB_REF_NAME}"
            echo "analyze  ${{ steps.analyze.outcome }}"
            echo "test     ${{ steps.test.outcome }}"
            echo "shots    ${{ steps.shots.outcome }}"
            echo "run      ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$out/summary.txt"

          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          work="$RUNNER_TEMP/results"
          if git fetch --depth 1 origin ci-results 2>/dev/null; then
            git worktree add "$work" FETCH_HEAD
            git -C "$work" checkout -B ci-results
          else
            git worktree add --detach "$work"
            git -C "$work" checkout --orphan ci-results
            git -C "$work" rm -rf -q . || true
          fi
          dest="$work/${GITHUB_SHA::7}"
          rm -rf "$dest" "$work/latest"
          mkdir -p "$dest"
          cp -r "$out"/. "$dest"/
          cp -r "$dest" "$work/latest"
          git -C "$work" add -A
          git -C "$work" commit -q -m "Results for ${GITHUB_SHA::7}" || true
          git -C "$work" push -q origin ci-results

      - name: Fail if the checks failed
        if: steps.analyze.outcome != 'success' || steps.test.outcome != 'success'
        run: |
          echo "analyze: ${{ steps.analyze.outcome }}  test: ${{ steps.test.outcome }}"
          exit 1
