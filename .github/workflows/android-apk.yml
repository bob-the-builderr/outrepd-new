# Builds OUTREPD for Android on GitHub's machines — the APK for a phone and
# the App Bundle for Google Play — so a release does not depend on the local
# disk that holds Flutter and Gradle. Also runs the checks, and publishes what
# they found where a git fetch can read it.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY   required — the same two lines as
#                                     apps/outrepd_flutter/supabase/keys.env.
#                                     Without them the job fails rather than
#                                     build an app that opens with no server,
#                                     which is exactly what shipped once.
#   REVENUECAT_ANDROID_KEY            RevenueCat's public Google Play key
#                                     (goog_...). Without it the build has no
#                                     paywall; the run says so in a warning.
#   LEVELPLAY_ANDROID_APP_KEY         the Android app's key in Unity LevelPlay,
#   LEVELPLAY_ANDROID_INTERSTITIAL    and its interstitial ad unit id. The
#                                     ads' first choice (lib/ads.dart).
#   LEVELPLAY_ANDROID_REWARDED        its rewarded ad unit (Rewarded_Android);
#                                     without it no reward is offered.
#   ADMOB_ANDROID_APP_ID              the Android app's id in AdMob
#                                     (ca-app-pub-...~...), and its
#   ADMOB_ANDROID_INTERSTITIAL        interstitial ad unit (ca-app-pub-.../...).
#                                     The ad when LevelPlay has none. Without
#                                     either pair, a build with no ads.
#   REVENUECAT_TEST_KEY               RevenueCat's Test Store key. Adds a
#                                     debug "outrepd test" APK where the
#                                     paywall can be tried with simulated
#                                     purchases, before any store is set up.
#   UPLOAD_KEYSTORE_BASE64            the upload keystore (.jks), as base64.
#   UPLOAD_KEYSTORE_PASSWORD          its password.
#   UPLOAD_KEY_ALIAS                  the key's alias ("upload").
#   UPLOAD_KEY_PASSWORD               optional: the keystore password is used
#                                     when unset (a PKCS12 keystore has one).
#     With the upload key, both files are signed with it and an App Bundle is
#     built for Play. Without it the APK is signed with a throwaway debug key —
#     a new one every run, so each APK replaces the last only by uninstalling
#     it first — and there is no App Bundle.
#
# Both files are under "Artifacts" on the run's page. Every run numbers its
# build 100 + the run number, so each upload to Play is higher than the last.
#
# Results land on two branches that a `git fetch` can read without signing in
# to GitHub: `ci-results` (analyzer, tests, screenshots — one folder per
# commit) and `ci-builds` (what the build job made, and with which key).

name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [camera-rep-counter, camera-rep-counter-zzqfhq]
    paths:
      - 'apps/outrepd_flutter/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/outrepd_flutter

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
      # AdMob (lib/ads.dart). The app id is read by Gradle into the manifest
      # (android/app/build.gradle.kts); the ad unit goes into the app.
      ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
      ADMOB_ANDROID_INTERSTITIAL: ${{ secrets.ADMOB_ANDROID_INTERSTITIAL }}
      # Unity LevelPlay (lib/ads.dart): the ads' first choice.
      LEVELPLAY_ANDROID_APP_KEY: ${{ secrets.LEVELPLAY_ANDROID_APP_KEY }}
      LEVELPLAY_ANDROID_INTERSTITIAL: ${{ secrets.LEVELPLAY_ANDROID_INTERSTITIAL }}
      LEVELPLAY_ANDROID_REWARDED: ${{ secrets.LEVELPLAY_ANDROID_REWARDED }}
      # Continue with Google: the web client id from Google Cloud. Without
      # it the Google button is not shown.
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
      UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to build without the server keys
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_ANON_KEY as repository secrets (Settings > Secrets and variables > Actions). An app built without them has no server."
            exit 1
          fi
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > supabase/keys.env
          if [ -n "$REVENUECAT_ANDROID_KEY" ]; then
            # Whatever is in the secret ships inside the app, where anybody
            # can read it out. A secret key (sk_) there is RevenueCat's whole
            # account in a stranger's hands, so it stops the build.
            case "$REVENUECAT_ANDROID_KEY" in
              sk_*) echo "::error::REVENUECAT_ANDROID_KEY is a RevenueCat SECRET key (sk_...). The app takes the public Google Play key, which starts goog_. Replace the secret, and rotate that sk_ key in RevenueCat."; exit 1 ;;
              goog_*) ;;
              *) echo "::warning::REVENUECAT_ANDROID_KEY does not start goog_. Is it RevenueCat's public Google Play key?" ;;
            esac
            printf 'REVENUECAT_ANDROID_KEY=%s\n' "$REVENUECAT_ANDROID_KEY" >> supabase/keys.env
          else
            echo "::warning::No REVENUECAT_ANDROID_KEY secret: this build has no Pro to buy."
          fi
          if [ -n "$ADMOB_ANDROID_APP_ID" ] && [ -n "$ADMOB_ANDROID_INTERSTITIAL" ]; then
            case "$ADMOB_ANDROID_APP_ID" in
              ca-app-pub-*~*) ;;
              *) echo "::error::ADMOB_ANDROID_APP_ID should be the app id, ca-app-pub-...~... (with a tilde). The ad unit, with a slash, goes in ADMOB_ANDROID_INTERSTITIAL."; exit 1 ;;
            esac
            case "$ADMOB_ANDROID_INTERSTITIAL" in
              ca-app-pub-*/*) ;;
              *) echo "::error::ADMOB_ANDROID_INTERSTITIAL should be the interstitial ad unit, ca-app-pub-.../... (with a slash)."; exit 1 ;;
            esac
            printf 'ADMOB_ANDROID_INTERSTITIAL=%s\n' "$ADMOB_ANDROID_INTERSTITIAL" >> supabase/keys.env
          else
            echo "::warning::No ADMOB_ANDROID_APP_ID / ADMOB_ANDROID_INTERSTITIAL secrets: no AdMob ads in this build."
          fi
          if [ -n "$LEVELPLAY_ANDROID_APP_KEY" ] && [ -n "$LEVELPLAY_ANDROID_INTERSTITIAL" ]; then
            printf 'LEVELPLAY_ANDROID_APP_KEY=%s\nLEVELPLAY_ANDROID_INTERSTITIAL=%s\n' "$LEVELPLAY_ANDROID_APP_KEY" "$LEVELPLAY_ANDROID_INTERSTITIAL" >> supabase/keys.env
            if [ -n "$LEVELPLAY_ANDROID_REWARDED" ]; then
              printf 'LEVELPLAY_ANDROID_REWARDED=%s\n' "$LEVELPLAY_ANDROID_REWARDED" >> supabase/keys.env
            else
              echo "::warning::No LEVELPLAY_ANDROID_REWARDED secret: no rewarded videos in this build."
            fi
          else
            echo "::warning::No LEVELPLAY_ANDROID_APP_KEY / LEVELPLAY_ANDROID_INTERSTITIAL secrets: no LevelPlay ads in this build."
          fi
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            printf 'GOOGLE_WEB_CLIENT_ID=%s\n' "$GOOGLE_WEB_CLIENT_ID" >> supabase/keys.env
          else
            echo "::warning::No GOOGLE_WEB_CLIENT_ID secret: no Continue with Google."
          fi

      # android/key.properties is what android/app/build.gradle.kts reads. It
      # only ever exists on this machine, for this run.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Never fails the run: a key that cannot be used is reported — in the
      # warning and in the ci-builds report — and the APK is built unsigned,
      # so there is always something to install and a reason to read. None of
      # this prints a secret, only whether each one worked.
      - name: The upload key
        id: key
        run: |
          note() { echo "note=$1" >> "$GITHUB_OUTPUT"; echo "::warning::$1"; }
          missing=""
          [ -z "$UPLOAD_KEYSTORE_BASE64" ] && missing="$missing UPLOAD_KEYSTORE_BASE64"
          [ -z "$UPLOAD_KEYSTORE_PASSWORD" ] && missing="$missing UPLOAD_KEYSTORE_PASSWORD"
          [ -z "$UPLOAD_KEY_ALIAS" ] && missing="$missing UPLOAD_KEY_ALIAS"
          if [ -n "$missing" ]; then
            note "No upload key: missing secret(s)$missing. The APK is signed with a throwaway debug key and there is no App Bundle."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chars=$(printf '%s' "$UPLOAD_KEYSTORE_BASE64" | tr -d '\r\n ' | wc -c)
          if ! printf '%s' "$UPLOAD_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/upload.jks" 2>/dev/null; then
            note "UPLOAD_KEYSTORE_BASE64 is not a base64 keystore ($chars characters; a real one is about 3,600). Paste it again."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$UPLOAD_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/list.txt" 2>&1; then
            note "The keystore does not open with UPLOAD_KEYSTORE_PASSWORD ($chars characters of keystore decoded). Check the password secret — it is the one typed into keytool."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$UPLOAD_KEYSTORE_PASSWORD" -alias "$UPLOAD_KEY_ALIAS" > /dev/null 2>&1; then
            note "The keystore opens, but has no key called '$UPLOAD_KEY_ALIAS'. UPLOAD_KEY_ALIAS should be: upload"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$UPLOAD_KEYSTORE_PASSWORD" "$UPLOAD_KEY_ALIAS" \
            "${UPLOAD_KEY_PASSWORD:-$UPLOAD_KEYSTORE_PASSWORD}" > android/key.properties
          echo "note=the upload key opens and has the alias" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Firebase, for push notifications and crash reports. Optional, like the
      # paywall key: without it the app has neither and says nothing about it.
      # The file has to name this app's package, or the Google services plugin
      # fails the whole build, so one that does not is left out and reported.
      - name: Firebase config
        id: firebase
        run: |
          note() { echo "note=$1" >> "$GITHUB_OUTPUT"; echo "::warning::$1"; }
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            note "No GOOGLE_SERVICES_JSON secret: this build has no push notifications and no crash reports."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          json="$GOOGLE_SERVICES_JSON"
          case "$json" in
            {*) ;;
            *) json=$(printf '%s' "$json" | tr -d '\r\n ' | base64 -d 2>/dev/null || true) ;;
          esac
          if ! printf '%s' "$json" | jq -e '.client[] | select(.client_info.android_client_info.package_name == "com.outrepd.outrepd")' > /dev/null 2>&1; then
            note "GOOGLE_SERVICES_JSON is not a google-services.json for com.outrepd.outrepd. Download it again from Firebase after adding the Android app with that package name."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$json" > android/app/google-services.json
          echo "note=push notifications and crash reports are in" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Both flags are required; see docs/building.md.
      - name: APK
        id: apk
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define-from-file=supabase/keys.env \
            --dart-define=BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100)) \
            --build-number=$((GITHUB_RUN_NUMBER + 100))

      - name: Check the server address is inside the APK
        run: |
          host="${SUPABASE_URL#https://}"
          host="${host%%/*}"
          apk=build/app/outputs/flutter-apk/app-release.apk
          if ! unzip -p "$apk" lib/arm64-v8a/libapp.so | grep -a -q -F "$host"; then
            echo "::error::The APK does not contain the Supabase address; it would open with no server."
            exit 1
          fi
          cp "$apk" "$RUNNER_TEMP/OUTREPD.apk"
          echo "Server address found in the APK."

      # What Google Play looks at before it takes a build, read off the APK
      # itself: the Android version targeted, every permission — the plugins
      # add their own, which the manifest in the repo does not show — and
      # whether the native libraries are laid out for 16 KB memory pages,
      # which Play requires of apps targeting Android 15 and later.
      - name: What Google Play will check
        if: steps.apk.outcome == 'success'
        run: |
          apk="$RUNNER_TEMP/OUTREPD.apk"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          report="$RUNNER_TEMP/play-check.txt"
          {
            echo "build-tools $(basename "$tools")"
            "$tools/aapt2" dump badging "$apk" \
              | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|uses-feature)" \
              | sed -E "s/^uses-permission: name='([^']*)'.*/permission  \1/; s/^uses-feature: name='([^']*)'.*/feature     \1/"
            echo "-- 16 KB pages"
            libs=$(mktemp -d)
            unzip -q -o "$apk" 'lib/*' -d "$libs" || true
            bad=0
            for so in $(find "$libs/lib" -name '*.so' | sort); do
              arch=$(basename "$(dirname "$so")")
              case "$arch" in arm64-v8a|x86_64) ;; *) continue ;; esac
              least=$(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}' \
                | while read -r a; do printf '%d\n' "$a"; done | sort -n | head -1)
              if [ "${least:-0}" -lt 16384 ]; then
                echo "4 KB only  $arch/$(basename "$so") (aligned to ${least:-?})"
                bad=1
              fi
            done
            [ "$bad" = 0 ] && echo "every arm64 and x86_64 library is aligned to 16 KB"
            if "$tools/zipalign" -c -P 16 4 "$apk" > /dev/null 2>&1; then
              echo "the APK's zip layout is 16 KB aligned"
            else
              echo "the APK's zip layout is NOT 16 KB aligned (or this zipalign cannot tell)"
            fi
          } > "$report" 2>&1 || true
          cat "$report"

      - name: App Bundle for Google Play
        id: aab
        if: steps.key.outputs.signed == 'true'
        run: |
          flutter build appbundle --release --no-tree-shake-icons \
            --dart-define-from-file=supabase/keys.env \
            --dart-define=BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100)) \
            --build-number=$((GITHUB_RUN_NUMBER + 100))
          aab=build/app/outputs/bundle/release/app-release.aab
          # Signed with the upload key, not a debug one: Play refuses those.
          keytool -printcert -jarfile "$aab" > "$RUNNER_TEMP/cert.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/cert.txt"; then
            echo "::error::The App Bundle is signed with a debug key; Google Play would refuse it."
            exit 1
          fi
          host="${SUPABASE_URL#https://}"
          host="${host%%/*}"
          if ! unzip -p "$aab" base/lib/arm64-v8a/libapp.so | grep -a -q -F "$host"; then
            echo "::error::The App Bundle does not contain the Supabase address."
            exit 1
          fi
          cp "$aab" "$RUNNER_TEMP/OUTREPD.aab"

      # Named after the commit, so a downloaded file says which code it is.
      - uses: actions/upload-artifact@v4
        with:
          name: OUTREPD-apk-${{ github.sha }}
          path: ${{ runner.temp }}/OUTREPD.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'true'
        with:
          name: OUTREPD-aab-${{ github.sha }}
          path: ${{ runner.temp }}/OUTREPD.aab
          retention-days: 30

      # One fixed place for the newest APK, so installing it is one link and
      # one file rather than a run page, two zips and picking the right one:
      #   https://github.com/bob-the-builderr/outrepd-new/releases/latest/download/OUTREPD.apk
      # Replaced whole on every build of the main branch, so the release only
      # ever holds the newest APK.
      - name: The newest APK, on the latest release
        if: steps.apk.outcome == 'success' && github.ref == 'refs/heads/camera-rep-counter'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=$((GITHUB_RUN_NUMBER + 100))
          gh release delete android-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create android-latest "$RUNNER_TEMP/OUTREPD.apk" \
            --target "$GITHUB_SHA" --latest \
            --title "Android build $build" \
            --notes "Build $build, from ${GITHUB_SHA::7}. Download OUTREPD.apk below and open it on an Android phone to install."

      - name: Publish what was built to the ci-builds branch
        if: always()
        working-directory: .
        run: |
          out="$RUNNER_TEMP/build-report"
          mkdir -p "$out"
          apk="$RUNNER_TEMP/OUTREPD.apk"
          aab="$RUNNER_TEMP/OUTREPD.aab"
          {
            echo "commit      ${GITHUB_SHA}"
            echo "build       $((GITHUB_RUN_NUMBER + 100))"
            echo "upload key  ${{ steps.key.outputs.signed }}"
            echo "key note    ${{ steps.key.outputs.note }}"
            echo "apk         ${{ steps.apk.outcome }} $( [ -f "$apk" ] && stat -c %s "$apk" ) bytes"
            echo "aab         ${{ steps.aab.outcome }} $( [ -f "$aab" ] && stat -c %s "$aab" ) bytes"
            echo "paywall key $( [ -n "$REVENUECAT_ANDROID_KEY" ] && echo yes || echo no )"
            echo "ads levelplay $( [ -n "$LEVELPLAY_ANDROID_APP_KEY" ] && [ -n "$LEVELPLAY_ANDROID_INTERSTITIAL" ] && echo yes || echo no ), admob $( [ -n "$ADMOB_ANDROID_APP_ID" ] && [ -n "$ADMOB_ANDROID_INTERSTITIAL" ] && echo yes || echo no )"
            echo "download    https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/OUTREPD.apk"
            echo "firebase    ${{ steps.firebase.outputs.ready }} — ${{ steps.firebase.outputs.note }}"
            if [ -f "$RUNNER_TEMP/cert.txt" ]; then
              echo "signed by   $(grep -m1 'Owner:' "$RUNNER_TEMP/cert.txt")"
              echo "sha-256     $(grep -m1 'SHA256:' "$RUNNER_TEMP/cert.txt" | sed 's/.*SHA256: //')"
            fi
            echo "run         ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$out/summary.txt"

          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          work="$RUNNER_TEMP/builds"
          # The paywall-test job pushes here too; retry on a race.
          for attempt in 1 2 3 4 5; do
            rm -rf "$work"
            if git fetch --depth 1 origin ci-builds 2>/dev/null; then
              git worktree add -f "$work" FETCH_HEAD
              git -C "$work" checkout -B ci-builds
            else
              git worktree add -f --detach "$work"
              git -C "$work" checkout --orphan ci-builds
              git -C "$work" rm -rf -q . || true
            fi
            mkdir -p "$work/${GITHUB_SHA::7}" "$work/latest"
            cp "$out/summary.txt" "$work/${GITHUB_SHA::7}/summary.txt"
            cp "$out/summary.txt" "$work/latest/summary.txt"
            if [ -f "$RUNNER_TEMP/play-check.txt" ]; then
              cp "$RUNNER_TEMP/play-check.txt" "$work/${GITHUB_SHA::7}/play-check.txt"
              cp "$RUNNER_TEMP/play-check.txt" "$work/latest/play-check.txt"
            fi
            git -C "$work" add -A
            git -C "$work" commit -q -m "Build ${GITHUB_SHA::7}" || true
            if git -C "$work" push -q origin ci-builds; then break; fi
            git worktree remove -f "$work" || true
            sleep $((attempt * 5))
          done

  # The paywall, tried without Google Play: a debug APK carrying RevenueCat's
  # Test Store key, where a purchase opens a sheet with buy / fail / cancel
  # instead of charging anybody. Debug on purpose — the SDK crashes a release
  # build that has a Test Store key, so this can never reach a store. It
  # installs as "outrepd test", beside the real app.
  # The release build is shrunk and renamed by R8 (Google Play marks it
  # otherwise). A class the shrinker wrongly removes kills the app before its
  # first frame, which no Dart test sees: so the release APK is installed on an
  # emulator and opened, and a crash in its first 30 seconds fails the run.
  launch-check:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v4
        with:
          name: OUTREPD-apk-${{ github.sha }}
          path: ${{ runner.temp }}/apk

      - name: Let the emulator use KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the release APK on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          working-directory: .
          script: bash .github/scripts/launch_check.sh ${{ runner.temp }}/apk/OUTREPD.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OUTREPD-launch-${{ github.sha }}
          path: launch/
          retention-days: 14

  paywall-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      REVENUECAT_TEST_KEY: ${{ secrets.REVENUECAT_TEST_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Only with a Test Store key
        id: have
        run: |
          if [ -z "$REVENUECAT_TEST_KEY" ]; then
            echo "::notice::No REVENUECAT_TEST_KEY secret: no paywall test build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::The paywall test build needs SUPABASE_URL and SUPABASE_ANON_KEY too: the paywall comes after signing up."
            exit 1
          fi
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nREVENUECAT_ANDROID_KEY=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$REVENUECAT_TEST_KEY" > supabase/keys.env
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.have.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.have.outputs.ready == 'true'
        with:
          channel: stable
          cache: true

      - name: Paywall test APK
        id: build
        if: steps.have.outputs.ready == 'true'
        run: |
          flutter pub get
          flutter build apk --debug --dart-define-from-file=supabase/keys.env
          cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/OUTREPD-paywall-test.apk"

      - uses: actions/upload-artifact@v4
        if: steps.have.outputs.ready == 'true'
        with:
          name: OUTREPD-paywall-test-${{ github.sha }}
          path: ${{ runner.temp }}/OUTREPD-paywall-test.apk
          retention-days: 30

      # Next to the build job's report on ci-builds. Both jobs push there, so
      # this one retries on a race rather than lose its line.
      - name: Publish what was built to the ci-builds branch
        if: always()
        working-directory: .
        run: |
          apk="$RUNNER_TEMP/OUTREPD-paywall-test.apk"
          report="$RUNNER_TEMP/paywall-test.txt"
          {
            echo "commit      ${GITHUB_SHA}"
            echo "test key    ${{ steps.have.outputs.ready }}"
            echo "test apk    ${{ steps.build.outcome }} $( [ -f "$apk" ] && stat -c %s "$apk" ) bytes"
            echo "run         ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$report"
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          work="$RUNNER_TEMP/builds-test"
          for attempt in 1 2 3 4 5; do
            rm -rf "$work"
            if git fetch --depth 1 origin ci-builds 2>/dev/null; then
              git worktree add -f "$work" FETCH_HEAD
              git -C "$work" checkout -B ci-builds
            else
              git worktree add -f --detach "$work"
              git -C "$work" checkout --orphan ci-builds
              git -C "$work" rm -rf -q . || true
            fi
            mkdir -p "$work/latest"
            cp "$report" "$work/latest/paywall-test.txt"
            git -C "$work" add -A
            git -C "$work" commit -q -m "Paywall test build ${GITHUB_SHA::7}" || true
            if git -C "$work" push -q origin ci-builds; then break; fi
            git worktree remove -f "$work" || true
            sleep $((attempt * 5))
          done

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    # A bare Postgres, so the server's SQL is run for real before anybody
    # pastes it into the project: installed twice over (it is pasted again
    # after every change), then attacked by tool/db/security_test.sql.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Server
        id: server
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/ci"
          set -o pipefail
          db=postgresql://postgres:postgres@localhost:5432/postgres
          up=postgresql://postgres:postgres@localhost:5432/upgrade
          # pg_net is Supabase's; stubs.sql stands in for the one call made.
          sed '/create extension if not exists pg_net/d' supabase/install.sql \
            > "$RUNNER_TEMP/install.sql"
          {
            psql "$db" -v ON_ERROR_STOP=1 -q -f tool/db/stubs.sql &&
            psql "$db" -v ON_ERROR_STOP=1 -q -f "$RUNNER_TEMP/install.sql" &&
            echo "installed once" &&
            psql "$db" -v ON_ERROR_STOP=1 -q -f "$RUNNER_TEMP/install.sql" &&
            echo "installed twice" &&
            psql "$db" -v ON_ERROR_STOP=1 -f tool/db/security_test.sql &&
            # The paste that upgrades the live project, run first here: its
            # server as last pasted (tool/db/live), filled with accounts and
            # duels, today's installer over it twice, and nothing lost. A
            # database of its own; the roles are the cluster's, made above.
            echo "--- upgrading the live project's server" &&
            psql "$db" -v ON_ERROR_STOP=1 -q -c 'create database upgrade' &&
            sed '/create extension if not exists pg_net/d' tool/db/live/install.sql > "$RUNNER_TEMP/live.sql" &&
            sed '/^create role /d' tool/db/stubs.sql > "$RUNNER_TEMP/stubs-db.sql" &&
            psql "$up" -v ON_ERROR_STOP=1 -q -f "$RUNNER_TEMP/stubs-db.sql" &&
            psql "$up" -v ON_ERROR_STOP=1 -q -f "$RUNNER_TEMP/live.sql" &&
            psql "$up" -v ON_ERROR_STOP=1 -q -f tool/db/upgrade_seed.sql &&
            psql "$up" -v ON_ERROR_STOP=1 -q -f "$RUNNER_TEMP/install.sql" &&
            psql "$up" -v ON_ERROR_STOP=1 -f tool/db/upgrade_check.sql &&
            psql "$up" -v ON_ERROR_STOP=1 -q -f "$RUNNER_TEMP/install.sql" &&
            psql "$up" -v ON_ERROR_STOP=1 -f tool/db/upgrade_check.sql
          } 2>&1 | tee "$RUNNER_TEMP/ci/server.txt"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/ci"
          set -o pipefail
          flutter analyze 2>&1 | tee "$RUNNER_TEMP/ci/analyze.txt"

      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/ci/test.txt"

      - name: Screenshots
        id: shots
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/fonts"
          curl -sSL -o "$RUNNER_TEMP/fonts/NotoSans.ttf" \
            "https://github.com/google/fonts/raw/main/ofl/notosans/NotoSans%5Bwdth,wght%5D.ttf"
          # Roboto, one file per weight, for the store screenshots: the face
          # the app is set in on Android.
          sudo apt-get install -y -qq fonts-roboto >/dev/null 2>&1 || true
          for w in Regular Medium Bold; do
            f=$(find /usr/share/fonts -name "Roboto-$w.ttf" 2>/dev/null | head -1)
            [ -n "$f" ] && cp "$f" "$RUNNER_TEMP/fonts/" || true
          done
          SHOT_FONTS="$RUNNER_TEMP/fonts" flutter test --update-goldens tool/screenshots/ 2>&1 | tee "$RUNNER_TEMP/ci/screenshots.txt"

      - name: Publish the results to the ci-results branch
        if: always()
        working-directory: .
        run: |
          out="$RUNNER_TEMP/ci"
          mkdir -p "$out/screens"
          cp apps/outrepd_flutter/tool/screenshots/goldens/*.png "$out/screens/" 2>/dev/null || true
          {
            echo "commit   ${GITHUB_SHA}"
            echo "branch   ${GITHUB_REF_NAME}"
            echo "analyze  ${{ steps.analyze.outcome }}"
            echo "test     ${{ steps.test.outcome }}"
            echo "shots    ${{ steps.shots.outcome }}"
            echo "server   ${{ steps.server.outcome }}"
            echo "run      ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$out/summary.txt"

          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          work="$RUNNER_TEMP/results"
          if git fetch --depth 1 origin ci-results 2>/dev/null; then
            git worktree add "$work" FETCH_HEAD
            git -C "$work" checkout -B ci-results
          else
            git worktree add --detach "$work"
            git -C "$work" checkout --orphan ci-results
            git -C "$work" rm -rf -q . || true
          fi
          dest="$work/${GITHUB_SHA::7}"
          rm -rf "$dest" "$work/latest"
          mkdir -p "$dest"
          cp -r "$out"/. "$dest"/
          cp -r "$dest" "$work/latest"
          git -C "$work" add -A
          git -C "$work" commit -q -m "Results for ${GITHUB_SHA::7}" || true
          git -C "$work" push -q origin ci-results

      - name: Fail if the checks failed
        if: steps.analyze.outcome != 'success' || steps.test.outcome != 'success' || steps.server.outcome != 'success'
        run: |
          echo "analyze: ${{ steps.analyze.outcome }}  test: ${{ steps.test.outcome }}  server: ${{ steps.server.outcome }}"
          exit 1
