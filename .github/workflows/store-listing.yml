# The App Store listing in every locale (apps/outrepd_flutter/fastlane/
# metadata, written by store/aso/build.js), put on App Store Connect through
# its API with the key the iOS build signs with, and read back to verify.
# Linux only: no Mac minutes. The answer lands on the ci-builds branch, in
# asc/listing.txt.
#
# Run by hand from the Actions tab:
#   check           — what is live, and what would change
#   push + version  — write it to that version (Prepare for Submission)
#   create + version — make that version first if it is missing, then push
#   shots + version  — the screenshots in store/screenshots, on its en-US
#   shots-check + version — what its en-US holds now

name: App Store listing

on:
  workflow_dispatch:
    inputs:
      mode:
        description: check, push, create, shots or shots-check
        required: true
        default: check
      version:
        description: the version to write to, like 1.1.3 (push only)
        required: false

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Listing
        working-directory: apps/outrepd_flutter
        run: |
          mode="${{ github.event.inputs.mode }}"
          version="${{ github.event.inputs.version }}"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          case "$mode" in
            shots)
              node store/aso/shots.mjs "$RUNNER_TEMP/AuthKey.p8" push "$version" \
                > "$RUNNER_TEMP/listing.txt" 2>&1 || true ;;
            shots-check)
              node store/aso/shots.mjs "$RUNNER_TEMP/AuthKey.p8" check "$version" \
                > "$RUNNER_TEMP/listing.txt" 2>&1 || true ;;
            *)
              node store/aso/build.js > "$RUNNER_TEMP/listing.txt" 2>&1 || true
              node store/aso/push.mjs "$RUNNER_TEMP/AuthKey.p8" "$mode" "$version" \
                >> "$RUNNER_TEMP/listing.txt" 2>&1 || true ;;
          esac
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          cat "$RUNNER_TEMP/listing.txt"

      - name: Publish to the ci-builds branch
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          work="$RUNNER_TEMP/builds"
          for attempt in 1 2 3 4 5; do
            rm -rf "$work"
            git fetch --depth 1 origin ci-builds
            git worktree add -f "$work" FETCH_HEAD
            git -C "$work" checkout -B ci-builds
            mkdir -p "$work/asc"
            { date -u +"asked       %Y-%m-%d %H:%M UTC"; cat "$RUNNER_TEMP/listing.txt"; } > "$work/asc/listing.txt"
            git -C "$work" add -A
            git -C "$work" commit -q -m "App Store listing" || true
            if git -C "$work" push -q origin ci-builds; then break; fi
            git worktree remove -f "$work" || true
            sleep $((attempt * 5))
          done
