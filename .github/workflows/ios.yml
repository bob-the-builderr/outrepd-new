# Builds OUTREPD for iPhone on GitHub's Mac machines and, once the Apple keys
# are in, signs it and uploads it to App Store Connect — where it shows up in
# TestFlight a few minutes later.
#
# Mac minutes cost ten times what Linux ones do on a private repository, so
# this does not run on every push: only when a commit message says [ios], or
# when started by hand from the Actions tab.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY   required, the same ones Android uses.
#   REVENUECAT_APPLE_KEY              RevenueCat's public App Store key
#                                     (appl_...). Without it, no paywall.
#   GOOGLE_SERVICE_INFO_PLIST         the GoogleService-Info.plist from the
#                                     iOS app in Firebase, pasted whole. Push
#                                     notifications and crash reports.
#   APPLE_TEAM_ID                     the ten-character team id.
#   ASC_KEY_ID, ASC_ISSUER_ID         an App Store Connect API key (Admin),
#   ASC_KEY_P8                        and the contents of its .p8 file.
#     With the last four, the build is signed (Xcode makes the certificate
#     and profile itself) and uploaded. Without them it is only built, to
#     prove it compiles.
#
#     The team also needs at least one iPhone registered under Devices in the
#     Apple Developer portal: automatic signing archives with a development
#     profile first, and Apple will not make one for a team with no devices
#     ("Your team has no devices from which to generate a provisioning
#     profile" — build 103).

name: iOS

on:
  workflow_dispatch:
  push:
    branches: [camera-rep-counter]
    paths:
      - 'apps/outrepd_flutter/**'
      - '.github/workflows/ios.yml'

defaults:
  run:
    working-directory: apps/outrepd_flutter

jobs:
  ios:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios]')
    # On the job, not the workflow: a push without [ios] still starts this
    # workflow, only to skip the job, and a workflow-level group would have
    # that empty run cancel an iPhone build halfway through its upload.
    concurrency:
      group: ios-${{ github.ref }}
      cancel-in-progress: true
    # macOS 26 for Xcode 26: connectivity_plus already uses the iOS 26 SDK, and
    # the App Store takes only builds made with the current one.
    runs-on: macos-26
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      REVENUECAT_APPLE_KEY: ${{ secrets.REVENUECAT_APPLE_KEY }}
      GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Server keys
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_ANON_KEY as repository secrets."
            exit 1
          fi
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > supabase/keys.env
          if [ -n "$REVENUECAT_APPLE_KEY" ]; then
            # Whatever is in the secret ships inside the app, where anybody
            # can read it out. A secret key (sk_) there is RevenueCat's whole
            # account in a stranger's hands, so it stops the build.
            case "$REVENUECAT_APPLE_KEY" in
              sk_*) echo "::error::REVENUECAT_APPLE_KEY is a RevenueCat SECRET key (sk_...). The app takes the public App Store key, which starts appl_. Replace the secret, and rotate that sk_ key in RevenueCat."; exit 1 ;;
              appl_*) ;;
              *) echo "::warning::REVENUECAT_APPLE_KEY does not start appl_. Is it RevenueCat's public App Store key?" ;;
            esac
            printf 'REVENUECAT_APPLE_KEY=%s\n' "$REVENUECAT_APPLE_KEY" >> supabase/keys.env
          else
            echo "::warning::No REVENUECAT_APPLE_KEY secret: this build has no paywall."
          fi

      # The four values the app starts Firebase with on iPhone (lib/firebase.dart),
      # read out of the plist rather than bundling the file.
      - name: Firebase config
        id: firebase
        run: |
          note() { echo "note=$1" >> "$GITHUB_OUTPUT"; echo "::warning::$1"; }
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            note "No GOOGLE_SERVICE_INFO_PLIST secret: no push notifications or crash reports on iPhone."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          plist="$RUNNER_TEMP/GoogleService-Info.plist"
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > "$plist"
          read_key() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist" 2>/dev/null; }
          bundle=$(read_key BUNDLE_ID)
          if [ "$bundle" != "com.outrepd.outrepd" ]; then
            note "GOOGLE_SERVICE_INFO_PLIST is for '$bundle', not com.outrepd.outrepd. Add the iOS app in Firebase with that bundle id and paste its plist."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            printf 'FIREBASE_IOS_API_KEY=%s\n' "$(read_key API_KEY)"
            printf 'FIREBASE_IOS_APP_ID=%s\n' "$(read_key GOOGLE_APP_ID)"
            printf 'FIREBASE_SENDER_ID=%s\n' "$(read_key GCM_SENDER_ID)"
            printf 'FIREBASE_PROJECT_ID=%s\n' "$(read_key PROJECT_ID)"
          } >> supabase/keys.env
          echo "note=push notifications and crash reports are in" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Apple signing key
        id: apple
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::No Apple keys (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8): building unsigned, to check it compiles."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Each run is a fresh Mac, so automatic signing makes a new development
      # certificate every time, and Apple caps how many an account holds —
      # build 120 stopped there. The old ones' keys left with their machines.
      - name: Clear old development certificates
        if: steps.apple.outputs.signed == 'true'
        run: node tool/ios/revoke_dev_certs.mjs "$RUNNER_TEMP/keys/AuthKey.p8"

      # The newest Xcode on the machine, whatever the image picked as default.
      - name: Xcode
        run: |
          # Not a beta: the App Store refuses builds made with one.
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Compiles the Dart and installs the pods; the archive below signs it.
      - name: Build
        id: build
        run: |
          # Without this the tee below would hide a failed build behind its
          # own success.
          set -o pipefail
          xcodebuild -version 2>&1 | tee "$RUNNER_TEMP/build.log"
          flutter build ios --release --no-codesign --no-tree-shake-icons \
            --dart-define-from-file=supabase/keys.env \
            --dart-define=BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100)) \
            --build-number=$((GITHUB_RUN_NUMBER + 100)) 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Archive, sign and upload to App Store Connect
        id: upload
        if: steps.apple.outputs.signed == 'true'
        run: |
          auth=(-allowProvisioningUpdates
                -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            "${auth[@]}" > "$RUNNER_TEMP/archive.log" 2>&1 || { tail -n 150 "$RUNNER_TEMP/archive.log"; exit 1; }
          test -d "$RUNNER_TEMP/Runner.xcarchive"
          cp ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            "${auth[@]}" > "$RUNNER_TEMP/export.log" 2>&1 || { tail -n 150 "$RUNNER_TEMP/export.log"; exit 1; }

      - name: Publish what was built to the ci-builds branch
        if: always()
        working-directory: .
        run: |
          out="$RUNNER_TEMP/ios-report"
          mkdir -p "$out"
          {
            echo "commit      ${GITHUB_SHA}"
            echo "platform    ios"
            echo "build       $((GITHUB_RUN_NUMBER + 100))"
            echo "compiled    ${{ steps.build.outcome }}"
            echo "signed      ${{ steps.apple.outputs.signed }}"
            echo "uploaded    ${{ steps.upload.outcome }}"
            # The one upload failure that is nothing to do with the code:
            # Apple holds every upload until the account holder accepts an
            # updated agreement in App Store Connect.
            if grep -q "REQUIRED_AGREEMENTS" "$RUNNER_TEMP/export.log" 2>/dev/null; then
              echo "upload note Apple wants an agreement accepted: App Store Connect > Business"
            fi
            echo "paywall key $( [ -n "$REVENUECAT_APPLE_KEY" ] && echo yes || echo no )"
            echo "firebase    ${{ steps.firebase.outputs.ready }} — ${{ steps.firebase.outputs.note }}"
            echo "run         ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$out/summary.txt"

          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          work="$RUNNER_TEMP/builds"
          for attempt in 1 2 3 4 5; do
            rm -rf "$work"
            if git fetch --depth 1 origin ci-builds 2>/dev/null; then
              git worktree add -f "$work" FETCH_HEAD
              git -C "$work" checkout -B ci-builds
            else
              git worktree add -f --detach "$work"
              git -C "$work" checkout --orphan ci-builds
              git -C "$work" rm -rf -q . || true
            fi
            mkdir -p "$work/${GITHUB_SHA::7}" "$work/ios-latest"
            cp "$out/summary.txt" "$work/${GITHUB_SHA::7}/ios-summary.txt"
            cp "$out/summary.txt" "$work/ios-latest/summary.txt"
            # The end of each log, since the run page needs a GitHub login.
            for log in build archive export; do
              if [ -f "$RUNNER_TEMP/$log.log" ]; then
                tail -n 200 "$RUNNER_TEMP/$log.log" > "$work/ios-latest/$log-log.txt"
              else
                rm -f "$work/ios-latest/$log-log.txt"
              fi
            done
            git -C "$work" add -A
            git -C "$work" commit -q -m "iOS build ${GITHUB_SHA::7}" || true
            if git -C "$work" push -q origin ci-builds; then break; fi
            git worktree remove -f "$work" || true
            sleep $((attempt * 5))
          done
