<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Pro fixes</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800;900&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0B0A09; color: #F5EFE4; font-family: 'Noto Sans', sans-serif; }
  .wrap { padding: 22px 26px 26px; width: 1260px; }
  .cap { direction: rtl; font-family: 'Noto Sans Arabic', 'Noto Sans', sans-serif; margin-bottom: 10px; }
  .cap b { display: block; font-size: 24px; margin-bottom: 4px; }
  .cap p { margin: 0; color: #8F8880; font-size: 15px; line-height: 1.7; }
  h2 { direction: rtl; font-family: 'Noto Sans Arabic', sans-serif; font-size: 18px; margin: 16px 0 8px; color: #E8DCC8; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .tile { width: 292px; background: #161412; border: 1px solid #2A2724; border-radius: 16px; padding: 12px; }
  .big svg { width: 266px; height: 266px; border-radius: 14px; display: block; }
  .small { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .small svg { width: 56px; height: 56px; border-radius: 28px; display: block; }
  .small .tiny svg { width: 34px; height: 34px; border-radius: 17px; }
  .sec { direction: rtl; font-family: 'Noto Sans Arabic', sans-serif; color: #8F8880; font-size: 13px; margin-bottom: 6px; }
  .code { font-weight: 900; font-size: 20px; color: #F2C14E; margin-top: 8px; }
  .name { font-size: 15px; font-weight: 700; }
  .note { direction: rtl; font-family: 'Noto Sans Arabic', sans-serif; color: #8F8880; font-size: 13px; line-height: 1.55; margin-top: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="cap"><b>أفكار جديدة للـ7 اللي لسه مش تمام</b><p>كل واحد كبير، وتحته صغير على 3 ألوان جلد وفي حجم الليدربورد. اختار واحد لكل خانة، والبُق اتنين (للخانتين M1 وM4).</p></div>
  <div id="out"></div>
</div>
<script src="lifterA.js"></script>
<script>
let gid = 0;
const ID = () => 'x' + (++gid);
const stopsOf = (stops) => stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('');
const linG = (id, stops, x1 = 0, y1 = 0, x2 = 0, y2 = 1) => `<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${stopsOf(stops)}</linearGradient>`;
const radG = (id, stops, cx = .5, cy = .5, r = .6) => `<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${stopsOf(stops)}</radialGradient>`;
const blur = (id, r) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${r}"/></filter>`;
function celG(key, d, base, lit, inner = '', w = 3.2, dx = -6, dy = -4) {
  const c = ID() + key;
  return `<clipPath id="${c}"><path d="${d}"/></clipPath><g clip-path="url(#${c})"><path d="${d}" fill="${base}"/>` +
    `<path d="${d}" fill="${lit}" transform="translate(${dx} ${dy})"/>${inner}</g><path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round"/>`;
}
const spark = (x, y, s = 1, col = '#fff') => `<path d="M${x} ${y - 5 * s} L${x + 1.3 * s} ${y - 1.3 * s} L${x + 5 * s} ${y} L${x + 1.3 * s} ${y + 1.3 * s} L${x} ${y + 5 * s} L${x - 1.3 * s} ${y + 1.3 * s} L${x - 5 * s} ${y} L${x - 1.3 * s} ${y - 1.3 * s} Z" fill="${col}"/>`;
const neon = (d, col, core = '#fff', w = 3, f) => `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w + 2}" stroke-linecap="round" stroke-linejoin="round" filter="url(#${f})" opacity=".9"/>` +
  `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${core}" stroke-width="${w * 0.4}" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`;

function compose(c, o = {}, view = 'full') {
  const id = 'A' + (++uid);
  const sk = CAT.skin[c.skin];
  const hc = CAT.hairC[c.hairC];
  const h = hair(id, c.hair, hc);
  let s = o.defs || '';
  s += background(id, c.bg, 0) + (o.under ?? '');
  s += o.top ?? topWear(id, c.top, CAT.topC[c.topC], sk);
  s += cel(id, 'neck', P.neck, shade(sk.c, -0.06)) + ink(P.neckLines, 2.6) + h.back;
  s += cel(id, 'earL', P.earL, sk.c) + cel(id, 'earR', P.earR, sk.c);
  s += cel(id, 'head', P.head, sk.c) + ink(P.jaw, 2.4, 0.6);
  s += o.marks ?? '';
  s += brows(c.brows, hc) + (o.eyes ?? eyes(id, c.eyes, sk));
  s += ink('M100 82 L95 98 C98 101 103 101 106 98', 2.4, 1);
  s += (o.beard ?? '') + (o.mouth ?? mouth(c.mouth));
  s += h.front + (o.gear ?? '');
  const vb = { head: '30 -6 140 140', face: '56 56 88 88', full: '0 0 200 200' }[view];
  return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}
const base = { skin: 5, hair: 2, hairC: 0, eyes: 0, brows: 0, mouth: 0, top: 3, topC: 0, bg: 3 };
const people = [base, { ...base, skin: 1, bg: 0, topC: 4 }, { ...base, skin: 8, bg: 1, topC: 2 }];
const FULLB = 'M66 80 C66 108 80 126 100 128 C120 126 134 108 134 80 C130 96 122 104 112 104 C106 100 94 100 88 104 C78 104 70 96 66 80 Z';

// ── eyes, every iris clipped to its eye white.
const WHITES = 'M77 82 C80 77 93 77 96 82 C92 86 81 86 77 82 Z M123 82 C120 77 107 77 104 82 C108 86 119 86 123 82 Z';
function eyesWith(inner, extra = '', defs = '') {
  const c = ID();
  return { defs: `<defs><clipPath id="${c}"><path d="${WHITES}"/></clipPath>${defs}</defs>`,
    eyes: `<path d="${WHITES}" fill="#fff"/><g clip-path="url(#${c})">${inner}</g><path d="${WHITES}" fill="none" stroke="${INK}" stroke-width="2.2"/>` + ink('M76 79 L96 80 M124 79 L104 80', 2.6, 1) + extra };
}
// ── B4 options ──
function galaxyBeard() {
  const g = ID();
  const sky = [[80, 100, 1.2], [92, 116, 1], [108, 118, 1.3], [120, 104, 1.1], [86, 110, 0.8], [114, 110, 0.9], [100, 124, 1]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff"/>`).join('');
  return { defs: `<defs>${radG(g, [[0, '#8A5CFF'], [.6, '#4A26B8'], [1, '#22125E']], .45, .4, .8)}</defs>`,
    beard: celG('bd', FULLB, '#1A0E4A', `url(#${g})`, sky + spark(118, 114, 0.7, '#FFE9A8')), mouth: mouth(2) };
}
function goldDustBeard() {
  const fl = [[78, 98], [84, 108], [92, 118], [100, 122], [108, 117], [116, 108], [122, 98], [88, 112], [112, 112], [96, 126], [104, 126]];
  return { beard: celG('bd', FULLB, '#0E0A0A', '#2A2020', fl.map(([x, y], k) => `<path d="M${x} ${y - 1.8} L${x + 1.8} ${y} L${x} ${y + 1.8} L${x - 1.8} ${y} Z" fill="${k % 2 ? '#F2C14E' : '#FFE08A'}"/>`).join('') + spark(84, 102, 0.6, '#FFF3C2') + spark(118, 120, 0.55, '#FFF3C2')), mouth: mouth(2) };
}

// ── mouth options (two of them become M1 and M4) ──
function bubbleGum() {
  const g = ID();
  return { defs: `<defs>${radG(g, [[0, '#FFD6EA'], [.7, '#FF8CC6'], [1, '#E85AA0']], .38, .35, .7)}</defs>`,
    mouth: `<ellipse cx="100" cy="107" rx="4.5" ry="3.6" fill="#3a1410" stroke="${INK}" stroke-width="2.2"/>` +
      `<circle cx="102" cy="114" r="11.5" fill="url(#${g})" stroke="${INK}" stroke-width="2.4"/>` + ink('M95 108 C97 105 101 104 104 105', 1.8, 0.85, '#fff') + `<circle cx="96.5" cy="111" r="1.4" fill="#fff" opacity=".85"/>` };
}
function hollywood() {
  return { mouth: `<path d="M85 101.5 C91 113.5 109 113.5 115 101.5 Z" fill="#3a1410" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/>` +
      `<path d="M86.5 102 L113.5 102 L112.4 107.4 C107 109.6 93 109.6 87.6 107.4 Z" fill="#FFFFFF"/>` + ink('M93 102 L93 108.4 M100 102 L100 109 M107 102 L107 108.4', 0.9, 0.35) +
      spark(110, 104.5, 0.6, '#BFEFFF') + ink('M117 97 L120 94 M118.5 100 L122.5 99.5', 1.4, 0.9, '#FFF3B0') };
}
function sharkGrin() {
  const lips = 'M83 101 C90 115 110 115 117 101 Z';
  const top = 'M84.5 101.6 L87.5 106.5 L90.5 101.6 L93.5 106.5 L96.5 101.6 L99.5 106.5 L102.5 101.6 L105.5 106.5 L108.5 101.6 L111.5 106.5 L114.5 101.6 Z';
  const bottom = 'M90 111.6 L92.8 107.6 L95.6 111.9 L98.4 107.6 L101.2 112 L104 107.6 L106.8 111.8 L109.6 107.6 L110.4 110.6 C104 113.6 96 113.6 90 111.6 Z';
  return { mouth: `<path d="${lips}" fill="#3a1410"/>` + `<path d="${top}" fill="#fff" stroke="${INK}" stroke-width="0.9" stroke-linejoin="round"/>` + `<path d="${bottom}" fill="#fff" stroke="${INK}" stroke-width="0.9" stroke-linejoin="round"/>` +
      `<path d="${lips}" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/>` };
}
function rainbowBraces() {
  const bands = ['#FF5A8A', '#FFB33D', '#FFE45C', '#5BE38A', '#5AD8FF', '#B98CFF'];
  return { mouth: `<path d="M85 101.5 C91 113.5 109 113.5 115 101.5 Z" fill="#3a1410" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/>` +
      `<path d="M86.5 102 L113.5 102 L112.4 107.4 C107 109.6 93 109.6 87.6 107.4 Z" fill="#fff"/>` +
      ink('M88 105 L112 105', 1.1, 1, '#9AA6B2') + [89.5, 94, 98, 102, 106, 110.5].map((x, k) => `<rect x="${x - 1.6}" y="103.4" width="3.2" height="3.2" rx=".8" fill="${bands[k]}" stroke="${INK}" stroke-width=".6"/>`).join('') };
}

// ── F1 options ──
function constellation() {
  const pts = [[118, 91], [125, 95], [131, 90], [128, 102], [121, 105]];
  const lines = 'M118 91 L125 95 L131 90 M125 95 L128 102 L121 105';
  return { marks: ink(lines, 0.9, 0.75, '#F5EFE4') + pts.map(([x, y], k) => spark(x, y, k === 1 ? 0.75 : 0.55, k === 1 ? '#FFE9A8' : '#FFFFFF')).join('') };
}
function clawMarks() {
  const f = ID();
  const d = 'M70 88 L82 106 M75 86 L87 104 M80 85 L91 101';
  return { defs: `<defs>${blur(f, 1.6)}</defs>`, marks: neon(d, '#FF3B3B', '#FFD0C8', 2.2, f) };
}
function championPaint() {
  return { marks: `<text x="124" y="104" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="15" fill="#F2C14E" stroke="${INK}" stroke-width="1.2" paint-order="stroke">1</text>` +
      ink('M114 106 L134 106', 1.6, 0.9, '#F2C14E') + spark(132, 92, 0.5, '#FFF3C2') };
}

// ── E3 options ──
function snakeEyes() {
  const f = ID();
  return eyesWith(`<path d="${WHITES}" fill="#D9F25C"/><ellipse cx="88" cy="82" rx="1.3" ry="4.2" fill="#141010"/><ellipse cx="112" cy="82" rx="1.3" ry="4.2" fill="#141010"/><circle cx="90" cy="80" r=".8" fill="#fff"/><circle cx="114" cy="80" r=".8" fill="#fff"/>`, '', blur(f, 1));
}
function goldEyes() {
  const g = ID();
  const iris = (x) => `<circle cx="${x}" cy="82" r="4" fill="url(#${g})" stroke="${INK}" stroke-width=".9"/><circle cx="${x}" cy="82" r="1.7" fill="#2A1A06"/><circle cx="${x + 1.3}" cy="80.7" r="1" fill="#fff"/>`;
  return eyesWith(iris(88) + iris(112), spark(125, 75, 0.5, '#FFF3C2'), radG(g, [[0, '#FFF0A8'], [.6, '#E2A928'], [1, '#9C6408']]));
}

// ── G1 options ──
function starShades() {
  const g = ID();
  const star = (cx, cy, R, r) => { let d = ''; for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r : R; d += `${k ? 'L' : 'M'}${(cx + rr * Math.cos(a)).toFixed(1)} ${(cy + rr * Math.sin(a)).toFixed(1)} `; } return d + 'Z'; };
  const lenses = star(87, 82.5, 11.5, 5.4) + ' ' + star(113, 82.5, 11.5, 5.4);
  return { defs: `<defs>${linG(g, [[0, '#FF8FC8'], [1, '#B4338A']])}</defs>`,
    gear: ink('M76 80 L65 77 M124 80 L135 77', 3.2, 1) + ink('M76 80 L65 77 M124 80 L135 77', 1.6, 1, '#E2A928') +
      `<path d="${lenses}" fill="url(#${g})" opacity=".92" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><path d="${lenses}" fill="none" stroke="#F2C14E" stroke-width="1.5" stroke-linejoin="round"/>` +
      ink('M97 81 C99 79.5 101 79.5 103 81', 3, 1) + ink('M97 81 C99 79.5 101 79.5 103 81', 1.4, 1, '#F2C14E') + ink('M82 79 L86 76 M108 79 L112 76', 1.4, 0.8, '#fff') };
}
function shutterShades() {
  const f = ID();
  const frame = 'M74 75 L97 75 L96 88 L75 88 Z M126 75 L103 75 L104 88 L125 88 Z';
  const slats = 'M75 78.2 L96.4 78.2 M75 81.4 L96.2 81.4 M75 84.6 L96 84.6 M103.6 78.2 L125 78.2 M103.8 81.4 L125 81.4 M104 84.6 L125 84.6';
  return { defs: `<defs>${blur(f, 2)}</defs>`,
    gear: `<path d="${frame}" fill="none" stroke="#FF3DD8" stroke-width="4" filter="url(#${f})" opacity=".8"/>` +
      `<path d="${frame}" fill="none" stroke="${INK}" stroke-width="3.6" stroke-linejoin="round"/><path d="${frame}" fill="none" stroke="#FF5AE0" stroke-width="2" stroke-linejoin="round"/>` +
      ink(slats, 2.4, 1) + ink(slats, 1.2, 1, '#FF5AE0') + ink('M97 79 L103 79', 2.6, 1) + ink('M97 79 L103 79', 1.2, 1, '#FF5AE0') + ink('M74 77 L65 75 M126 77 L135 75', 2.6, 1) };
}

// ── G4 options ──
function neonWings() {
  const f = ID(), g = ID();
  const wing = (s) => {
    const X = (v) => (100 + s * v).toFixed(1);
    return `M${X(28)} 150 C${X(40)} 120 ${X(60)} 86 ${X(96)} 62 C${X(100)} 78 ${X(96)} 90 ${X(88)} 98 C${X(100)} 104 ${X(98)} 118 ${X(88)} 122 C${X(96)} 130 ${X(92)} 142 ${X(78)} 146 C${X(64)} 154 ${X(44)} 156 ${X(28)} 150 Z`;
  };
  const feathers = (s) => { const X = (v) => (100 + s * v).toFixed(1); return `M${X(40)} 140 C${X(54)} 116 ${X(70)} 96 ${X(90)} 76 M${X(46)} 146 C${X(60)} 128 ${X(74)} 114 ${X(86)} 104 M${X(52)} 151 C${X(64)} 142 ${X(74)} 134 ${X(84)} 126`; };
  const both = wing(1) + ' ' + wing(-1);
  return { defs: `<defs>${blur(f, 3)}${linG(g, [[0, '#BFF8FF'], [1, '#3DB8FF']], 0, 0, 0, 1)}</defs>`,
    under: `<path d="${both}" fill="#3DE0FF" opacity=".7" filter="url(#${f})"/><path d="${both}" fill="url(#${g})" opacity=".8" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><path d="${both}" fill="none" stroke="#E6FDFF" stroke-width="1.4" stroke-linejoin="round"/>` +
      ink(feathers(1) + ' ' + feathers(-1), 1.4, 0.9, '#E6FDFF') };
}
function kettlebellChain() {
  const g = ID();
  return { defs: `<defs>${linG(g, [[0, '#FFF0A8'], [1, '#C98A12']], 0, 0, 1, 1)}</defs>`,
    gear: `<path d="M64 132 C70 166 130 166 136 132" fill="none" stroke="${INK}" stroke-width="5" stroke-dasharray="1 4.2" stroke-linecap="round"/>` +
      `<path d="M64 132 C70 166 130 166 136 132" fill="none" stroke="#F2C14E" stroke-width="3" stroke-dasharray="1 4.2" stroke-linecap="round"/>` +
      `<path d="M89.5 170 C88 150 112 150 110.5 170" fill="none" stroke="${INK}" stroke-width="6.5"/><path d="M89.5 170 C88 150 112 150 110.5 170" fill="none" stroke="#F2C14E" stroke-width="3.6"/>` +
      celG('kb', 'M86 174 C86 165 114 165 114 174 C116 183 111 191 100 191 C89 191 84 183 86 174 Z', '#9C6408', `url(#${g})`, ink('M91 172 C93 169 98 168 102 168.5', 1.8, 0.9, '#FFFBE6'), 2.8, -2, -2) +
      `<text x="100" y="185" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="8" fill="#7A4E06">24</text>` };
}

const sections = [
  ['B4 — دقن', [['B4 a', 'Galaxy beard', galaxyBeard, 'head', 'نفس سما الجالاكسي أفرو، في الدقن. تتلبس معاه.'], ['B4 b', 'Gold dust', goldDustBeard, 'head', 'دقن سودا وفيها برق دهب صغير بيلمع.']]],
  ['البُق — اختار اتنين (M1 وM4)', [['M a', 'Bubble gum', bubbleGum, 'face', 'بالونة لبان بينك طالعة من البُق.'], ['M b', 'Hollywood smile', hollywood, 'face', 'ابتسامة سنان بيضا بتلمع.'], ['M c', 'Shark grin', sharkGrin, 'face', 'ابتسامة بسنان قرش من فوق ومن تحت.'], ['M d', 'Rainbow braces', rainbowBraces, 'face', 'تقويم بحلقات بألوان قوس قزح.']]],
  ['F1 — علامة وش', [['F1 a', 'Constellation', constellation, 'face', 'نجوم صغيرة متوصلة على الخد.'], ['F1 b', 'Claw marks', clawMarks, 'face', 'تلات خدوش منوّرة أحمر.'], ['F1 c', 'Champion paint', championPaint, 'face', 'رقم 1 دهب مرسوم على الخد.']]],
  ['E3 — عيون', [['E3 a', 'Snake eyes', snakeEyes, 'face', 'عيون تعبان: صفرا وبؤبؤ رفيع.'], ['E3 b', 'Gold eyes', goldEyes, 'face', 'عيون دهب ولمعة.']]],
  ['G1 — نضارة', [['G1 a', 'Star shades', starShades, 'head', 'نضارة نجوم بإطار دهب وعدسة بينك.'], ['G1 b', 'Shutter shades', shutterShades, 'head', 'نضارة شيش نيون بينك.']]],
  ['G4 — إكسسوار', [['G4 a', 'Neon wings', neonWings, 'full', 'جناحات نيون منوّرة ورا الكتفين.'], ['G4 b', 'Kettlebell chain', kettlebellChain, 'full', 'سلسلة دهب فيها كيتل بِل دهب.']]],
];

const draw = (make, who, view) => compose(who, make(), view);
document.getElementById('out').innerHTML = '<div class="row">' + sections.map(([title, items]) => items.map(([code, name, make, view, note]) =>
  `<div class="tile"><div class="sec">${title}</div><div class="big">${draw(make, base, view)}</div><div class="small">${people.map(p => `<div>${draw(make, p, view === 'face' ? 'head' : view)}</div>`).join('')}<div class="tiny">${draw(make, base, view === 'face' ? 'head' : view)}</div></div>` +
  `<div class="code">${code}</div><div class="name">${name}</div><div class="note">${note}</div></div>`).join('')).join('') + '</div>';
</script>
</body>
</html>
