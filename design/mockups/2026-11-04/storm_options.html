<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Storm mohawk</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800;900&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0B0A09; color: #F5EFE4; font-family: 'Noto Sans', sans-serif; }
  .wrap { padding: 22px 26px 26px; width: 1260px; }
  .cap { direction: rtl; font-family: 'Noto Sans Arabic', 'Noto Sans', sans-serif; margin-bottom: 12px; }
  .cap b { display: block; font-size: 24px; margin-bottom: 4px; }
  .cap p { margin: 0; color: #8F8880; font-size: 15px; line-height: 1.7; }
  .row { display: flex; gap: 16px; }
  .tile { width: 292px; background: #161412; border: 1px solid #2A2724; border-radius: 16px; padding: 12px; }
  .tile.old { opacity: .75; }
  .big svg { width: 266px; height: 266px; border-radius: 14px; display: block; }
  .small { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .small svg { width: 56px; height: 56px; border-radius: 28px; display: block; }
  .small .tiny svg { width: 34px; height: 34px; border-radius: 17px; }
  .code { font-weight: 900; font-size: 20px; color: #F2C14E; margin-top: 10px; }
  .name { font-size: 15px; font-weight: 700; }
  .note { direction: rtl; font-family: 'Noto Sans Arabic', sans-serif; color: #8F8880; font-size: 13.5px; line-height: 1.6; margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="cap"><b>H3 — 3 أفكار جديدة</b><p>كل واحد تحته صغير على 3 ألوان جلد وفي حجم الليدربورد.</p></div>
  <div class="row" id="row"></div>
</div>
<script src="lifterA.js"></script>
<script>
let gid = 0;
const ID = () => 'h' + (++gid);
const stopsOf = (stops) => stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('');
const linG = (id, stops, x1, y1, x2, y2) => `<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${stopsOf(stops)}</linearGradient>`;
const radG = (id, stops, cx = .5, cy = .5, r = .6) => `<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${stopsOf(stops)}</radialGradient>`;
const blur = (id, r) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${r}"/></filter>`;
function celG(key, d, base, lit, inner = '', w = 3.4, dx = -9, dy = -6) {
  const c = ID() + key;
  return `<clipPath id="${c}"><path d="${d}"/></clipPath><g clip-path="url(#${c})"><path d="${d}" fill="${base}"/>` +
    `<path d="${d}" fill="${lit}" transform="translate(${dx} ${dy})"/>${inner}</g><path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round"/>`;
}
const BUZZD = 'M66 64 C64 40 80 30 100 30 C120 30 136 40 134 64 C128 48 116 42 100 42 C84 42 72 48 66 64 Z';

function lifter(c, hairBack, hairFront, defs = '') {
  const id = 'A' + (++uid);
  const sk = CAT.skin[c.skin];
  let s = defs + background(id, c.bg, 0) + topWear(id, c.top, CAT.topC[c.topC], sk);
  s += cel(id, 'neck', P.neck, shade(sk.c, -0.06)) + ink(P.neckLines, 2.6) + hairBack;
  s += cel(id, 'earL', P.earL, sk.c) + cel(id, 'earR', P.earR, sk.c);
  s += cel(id, 'head', P.head, sk.c) + ink(P.jaw, 2.4, 0.6);
  s += brows(c.brows, c.browC ?? '#141010') + eyes(id, c.eyes, sk);
  s += ink('M100 82 L95 98 C98 101 103 101 106 98', 2.4, 1) + mouth(c.mouth) + hairFront;
  return `<svg viewBox="30 -12 140 140" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}

// ── the afro, one cloud of hair.
// Outer edge: bumps along an ellipse over the top, from beside one ear to
// beside the other. Inner edge: a hairline that is hair meeting skin — the
// temples, a soft forehead line, down in front of the ears.
function afroShape() {
  const cx = 100, cy = 44, rx = 58, ry = 50;
  const a0 = Math.PI * 0.80, a1 = Math.PI * 2.20, n = 15;
  const pt = (a) => [cx + rx * Math.cos(a), cy + ry * Math.sin(a)];
  let [x, y] = pt(a0);
  let d = `M${(x).toFixed(1)} ${(y).toFixed(1)}`;
  for (let k = 1; k <= n; k++) {
    const [x2, y2] = pt(a0 + (a1 - a0) * k / n);
    const r = Math.hypot(x2 - x, y2 - y) * 0.62;
    d += ` A${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`;
    [x, y] = [x2, y2];
  }
  // Down the right side to the ear, the sideburn, the hairline across, and up.
  d += ' C150 82 146 90 140 92 L136 84 C136 74 134 66 132 62 C124 54 112 50 100 50 C88 50 76 54 68 62 C66 66 64 74 64 84 L60 92 C54 90 50 82 53.1 76.4 Z';
  return d;
}
// Little coils in the hair, so it reads as hair and not as a solid.
const coils = (col, o) => [[70, 24], [86, 14], [104, 10], [122, 16], [136, 28], [62, 42], [78, 34], [96, 28], [114, 30], [130, 42], [144, 54], [56, 60], [72, 50], [140, 70], [58, 76]]
  .map(([x, y]) => `<path d="M${x - 3} ${y + 1} C${x - 3} ${y - 3} ${x + 3} ${y - 3} ${x + 3} ${y + 1} C${x + 3} ${y + 4} ${x - 1} ${y + 4} ${x - 1} ${y + 1}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linecap="round" opacity="${o}"/>`).join('');

function afroOld(hc) { const c = { skin: 7, hair: 5, hairC: 0, eyes: 0, brows: 0, mouth: 0, beard: 0, marks: 0, top: 3, topC: 0, gear: 0, bg: 3 }; return lifterSvg(c, 'head'); }

// Drawn twice: whole, behind the ears and the head; and above the ears again
// in front, for the hair over the forehead. The ears stay in sight.
function aboveEars(svg) { const c = ID(); return `<clipPath id="${c}"><rect x="-20" y="-40" width="240" height="108"/></clipPath><g clip-path="url(#${c})">${svg}</g>`; }
function afroNew(hc = '#141010') {
  const d = afroShape();
  const draw = () => celG('f', d, shade(hc, -0.35), hc, coils(shade(hc, 0.35), 0.55));
  return { back: draw(), front: aboveEars(draw()), defs: '' };
}

function galaxyAfro() {
  const lit = ID();
  const d = afroShape();
  const defs = `<defs>${radG(lit, [[0, '#8A5CFF'], [.55, '#4A26B8'], [1, '#2A1670']], .42, .3, .75)}</defs>`;
  const sky = [[76, 22, 1.6], [92, 14, 1.2], [110, 22, 1.8], [126, 16, 1.3], [138, 34, 1.4], [84, 40, 1.1], [118, 38, 1], [64, 50, 1.1], [146, 58, 1.2]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff"/>`).join('') +
    `<path d="M100 4 L102.4 11 L109 13 L102.4 15 L100 22 L97.6 15 L91 13 L97.6 11 Z" fill="#FFE9A8"/>` +
    `<ellipse cx="130" cy="24" rx="7" ry="2.2" fill="none" stroke="#FFB3E1" stroke-width="1.5" transform="rotate(-20 130 24)"/><circle cx="130" cy="24" r="3.6" fill="#FF8FC8"/>`;
  const draw = () => celG('f', d, '#1A0E4A', `url(#${lit})`, coils('#B79CFF', 0.4) + sky);
  return { back: draw(), front: aboveEars(draw()), defs };
}

// ── the storm mohawk, on the app's own mohawk footprint (x 88-112, from the
// hairline at 46), its edges cut into spikes; the sides buzzed.
function stormHawk() {
  const lit = ID(), gl = ID();
  const fin = 'M90 46 L88 36 L82 32 L88 26 L83 18 L91 16 L89 4 L96 9 L100 -6 L104 9 L111 4 L109 16 L117 18 L112 26 L118 32 L112 36 L110 46 C106 44 94 44 90 46 Z';
  const defs = `<defs>${linG(lit, [[0, '#E6FDFF'], [.45, '#5FDCFF'], [1, '#2F6FE8']], 0, 0, 0, 1)}${blur(gl, 3)}</defs>`;
  const sparks = 'M80 10 L76 6 L79 5 L75 0 M122 10 L126 6 L123 5 L127 0';
  const sides = 'M66 66 C64 48 70 40 80 37 L86 46 C76 50 70 56 66 66 Z M134 66 C136 48 130 40 120 37 L114 46 C124 50 130 56 134 66 Z';
  const front = `<path d="${sides}" fill="#141010" opacity=".5"/>` + `<path d="${fin}" fill="#4FD8FF" opacity=".55" filter="url(#${gl})"/>` +
    celG('f', fin, '#1E4FC8', `url(#${lit})`, ink('M96 32 L98 14 M104 14 L105 30', 1.8, 0.8, '#fff')) +
    `<g filter="url(#${gl})">${ink(sparks, 2.6, 1, '#4FD8FF')}</g>` + ink(sparks, 1.2, 1, '#E6FDFF');
  return { back: '', front, defs };
}
function mohawkOld() { const c = { skin: 5, hair: 6, hairC: 0, eyes: 0, brows: 0, mouth: 0, beard: 0, marks: 0, top: 3, topC: 0, gear: 0, bg: 3 }; return lifterSvg(c, 'head'); }


// A: liberty spikes, each one rooted on the scalp along the top of the head.
function spikesHawk() {
  const lit = ID(), gl = ID();
  const sides = 'M66 66 C64 48 70 40 80 37 L88 46 C76 50 70 56 66 66 Z M134 66 C136 48 130 40 120 37 L112 46 C124 50 130 56 134 66 Z';
  const spike = (bx, bw, tx, ty) => `M${bx - bw} 46 L${tx} ${ty} L${bx + bw} 46 Z`;
  const spikes = [[88, 6, 78, 8], [94, 6, 90, -2], [100, 6.5, 100, -10], [106, 6, 110, -2], [112, 6, 122, 8]];
  const base = 'M87 47 C87 36 92 30 100 30 C108 30 113 36 113 47 C108 45 92 45 87 47 Z';
  const defs = `<defs>${linG(lit, [[0, '#E6FDFF'], [.5, '#5FDCFF'], [1, '#2F6FE8']], 0, 0, 0, 1)}${blur(gl, 3)}</defs>`;
  let front = `<path d="${sides}" fill="#141010" opacity=".5"/>`;
  front += celG('b', base, '#0B1530', '#1E2E5C', '', 3, -3, -2);
  front += spikes.map(([bx, bw, tx, ty]) => celG('s', spike(bx, bw, tx, ty), '#2456D8', `url(#${lit})`, '', 2.8, -2.5, -1.5)).join('');
  front += spikes.map(([bx, bw, tx, ty]) => `<circle cx="${tx}" cy="${ty + 3}" r="2.6" fill="#E6FDFF" filter="url(#${gl})"/>`).join('');
  return { back: '', front, defs };
}

// B: a full combed mohawk, the hair itself, neon pink to orange.
function neonHawk() {
  const lit = ID();
  const sides = 'M66 66 C64 48 70 40 80 37 L86 46 C76 50 70 56 66 66 Z M134 66 C136 48 130 40 120 37 L114 46 C124 50 130 56 134 66 Z';
  const crest = 'M86 48 C82 30 84 12 94 2 C98 -2 106 -4 112 0 C108 4 108 8 112 10 C118 16 118 32 114 48 C106 45 94 45 86 48 Z';
  const strands = 'M92 44 C88 30 90 16 98 6 M100 44 C98 30 100 16 106 6 M108 44 C108 32 110 20 112 12';
  const defs = `<defs>${linG(lit, [[0, '#FFB36B'], [.5, '#FF5AA8'], [1, '#C23CFF']], 0, 0, 0, 1)}</defs>`;
  const front = `<path d="${sides}" fill="#141010" opacity=".5"/>` + celG('c', crest, '#8A1E9C', `url(#${lit})`, ink(strands, 2, 0.55, '#5A0F6A') + ink('M94 10 C96 6 100 4 104 4', 2.2, 0.8, '#FFF0E0'));
  return { back: '', front, defs };
}

// C: no mohawk at all: a short crew, a lit lightning bolt shaved into each side.
function boltFade() {
  const gl = ID();
  const crew = 'M64 64 C62 38 80 26 100 26 C120 26 138 38 136 64 C130 50 118 44 100 46 C82 44 70 50 64 64 Z';
  const boltL = 'M74 40 L68 50 L73 50 L67 60';
  const boltR = 'M126 40 L132 50 L127 50 L133 60';
  const front = celG('c', crew, '#0E0A0A', '#2A2020', ink('M78 34 C88 28 112 28 122 34', 2, 0.4, '#fff')) +
    `<g filter="url(#${gl})">${ink(boltL + ' ' + boltR, 4.2, 1, '#4FD8FF')}</g>` + ink(boltL + ' ' + boltR, 2, 1, '#E6FDFF');
  return { back: '', front, defs: `<defs>${blur(gl, 2.2)}</defs>` };
}
const people = [
  { skin: 7, brows: 0, eyes: 0, mouth: 0, top: 3, topC: 0, bg: 3 },
  { skin: 1, brows: 0, eyes: 0, mouth: 1, top: 3, topC: 4, bg: 0 },
  { skin: 9, brows: 0, eyes: 0, mouth: 0, top: 3, topC: 2, bg: 1 },
];
const render = (make, who = people[0]) => { const h = make(); return lifter(who, h.back, h.front, h.defs); };
const tiles = [
  ['A', 'Storm spikes', () => render(spikesHawk, { ...people[0], skin: 5 }), spikesHawk, 'خمس سبايكس منفصلة نابتة من وسط الدماغ، أطرافها بيضا منوّرة، والجناب محلوقة.'],
  ['B', 'Neon mohawk', () => render(neonHawk, { ...people[0], skin: 5 }), neonHawk, 'موهوك عريض كأنه شعر ممشّط لفوق ولورا، لونه نيون من البرتقالي للبنفسجي.'],
  ['C', 'Bolt fade', () => render(boltFade, { ...people[0], skin: 5 }), boltFade, 'قصة قصيرة، وعلى كل جنب برق محفور ومنوّر. قاعدة على الدماغ زي القصة العادية بالظبط.'],
];
document.getElementById('row').innerHTML = tiles.map(([code, name, big, make, note]) => {
  const smalls = make ? people.map(p => `<div>${render(make, p)}</div>`).join('') + `<div class="tiny">${render(make)}</div>` : '';
  const extra = '';
  return `<div class="tile ${code === 'old' ? 'old' : ''}"><div class="big">${big()}</div><div class="small">${smalls}${extra}</div>` +
    `<div class="code">H3 ${code}</div><div class="name">${name}</div><div class="note">${note}</div></div>`;
}).join('');
</script>
</body>
</html>
