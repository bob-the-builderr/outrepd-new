<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Pro parts</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800;900&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0B0A09; color: #F5EFE4; font-family: 'Noto Sans', sans-serif; }
  .wrap { padding: 22px 26px 30px; width: 1260px; }
  .cap { direction: rtl; font-family: 'Noto Sans Arabic', 'Noto Sans', sans-serif; margin-bottom: 8px; }
  .cap b { display: block; font-size: 24px; margin-bottom: 4px; }
  .cap p { margin: 0; color: #8F8880; font-size: 15px; line-height: 1.7; }
  .sec { margin-top: 18px; }
  .sec h2 { direction: rtl; font-family: 'Noto Sans Arabic', sans-serif; font-size: 19px; margin: 0 0 8px; color: #E8DCC8; }
  .sec h2 span { color: #8F8880; font-size: 14px; font-weight: 400; margin-right: 8px; }
  .row { display: flex; gap: 14px; }
  .tile { width: 290px; background: #161412; border: 1px solid #2A2724; border-radius: 16px; padding: 10px; display: flex; gap: 10px; align-items: center; }
  .tile .pic { width: 120px; height: 120px; border-radius: 14px; overflow: hidden; flex: none; background: #201D1A; }
  .tile .pic svg { width: 120px; height: 120px; display: block; }
  .tile.wide { width: 290px; flex-direction: column; align-items: stretch; }
  .tile.wide .pic { width: 100%; height: 120px; }
  .tile.wide .pic svg { width: 100%; height: 120px; }
  .code { font-weight: 900; font-size: 22px; color: #F2C14E; }
  .name { font-size: 15px; font-weight: 700; }
  .pro { display: inline-block; font-size: 10px; font-weight: 900; letter-spacing: .5px; color: #121110; background: linear-gradient(90deg,#F2C14E,#FFE08A); border-radius: 6px; padding: 1px 6px; margin-top: 4px; }
  .wide .meta { display: flex; gap: 10px; align-items: baseline; }
</style>
</head>
<body>
<div class="wrap">
  <div class="cap"><b>أشكال Pro مقترحة للأفاتار والبروفايل</b>
  <p>4 في كل قسم، كل واحد ليه كود. راجعتهم على الـ197 قطعة اللي في التطبيق: ولا واحد فيهم نسخة بلون تاني من قطعة ببلاش، ولا قريب من قطعة بتتكسب في الأدفنشر (التاج والهالة والنار والمجرة ... فضلوا مكافآت للعب). اللي فيه نار أو نيون أو نجوم هيتحرك جوه التطبيق.</p></div>
  <div id="out"></div>
</div>
<script src="lifterA.js"></script>
<script>
let gid = 0;
const ID = () => 'p' + (++gid);
const lin = (id, stops, x2 = 0, y2 = 1) => `<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}">${stops.map((c, i) => `<stop offset="${i / (stops.length - 1)}" stop-color="${c}"/>`).join('')}</linearGradient>`;
const glow = (id, r = 3) => `<filter id="${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${r}"/></filter>`;
const inked = (d, fill, w = 3.2) => `<path d="${d}" fill="${fill}" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round"/>`;
const stars = (pts, r = 1.4, col = '#fff') => pts.map(([x, y, s]) => `<circle cx="${x}" cy="${y}" r="${(s || 1) * r}" fill="${col}"/>`).join('');
const spark = (x, y, s = 1, col = '#fff') => `<path d="M${x} ${y - 5 * s} L${x + 1.3 * s} ${y - 1.3 * s} L${x + 5 * s} ${y} L${x + 1.3 * s} ${y + 1.3 * s} L${x} ${y + 5 * s} L${x - 1.3 * s} ${y + 1.3 * s} L${x - 5 * s} ${y} L${x - 1.3 * s} ${y - 1.3 * s} Z" fill="${col}"/>`;

// A lifter, lifterA.js's way, with any part replaced.
function compose(c, o = {}, view = 'full') {
  const id = 'A' + (++uid);
  const sk = CAT.skin[c.skin];
  const hc = CAT.hairC[c.hairC];
  const tc = CAT.topC[c.topC];
  const h = hair(id, c.hair, hc);
  let s = o.defs || '';
  s += o.bg ?? background(id, c.bg, 0);
  s += o.top ?? topWear(id, c.top, tc, sk);
  s += cel(id, 'neck', P.neck, shade(sk.c, -0.06)) + ink(P.neckLines, 2.6);
  s += o.hairBack ?? h.back;
  s += cel(id, 'earL', P.earL, sk.c) + cel(id, 'earR', P.earR, sk.c);
  s += cel(id, 'head', P.head, sk.c) + ink(P.jaw, 2.4, 0.6);
  s += o.marks ?? '';
  s += (o.brows ?? brows(c.brows, hc)) + (o.eyes ?? eyes(id, c.eyes, sk));
  s += ink('M100 82 L95 98 C98 101 103 101 106 98', 2.4, 1);
  const b = o.beard ?? beard(id, c.beard, hc);
  s += b + (o.mouth ?? mouth(c.mouth));
  s += o.hairFront ?? h.front;
  s += o.gear ?? '';
  s += o.over ?? '';
  const vb = view === 'head' ? '30 -6 140 140' : view === 'face' ? '56 56 88 88' : '0 0 200 200';
  return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}
const base = { skin: 5, hair: 2, hairC: 0, eyes: 0, brows: 0, mouth: 0, beard: 0, marks: 0, top: 3, topC: 0, gear: 0, bg: 3 };
const dark = { ...base, skin: 7 };
const light = { ...base, skin: 1 };
const CREWD = 'M64 64 C62 38 80 26 100 26 C120 26 138 38 136 64 C130 50 118 44 100 46 C82 44 70 50 64 64 Z';
const FULLB = 'M66 80 C66 108 80 126 100 128 C120 126 134 108 134 80 C130 96 122 104 112 104 C106 100 94 100 88 104 C78 104 70 96 66 80 Z';
const FIRE = ['#FFE45C', '#FF9A1F', '#E8401C'];

const sections = [];
const add = (title, sub, items, opts = {}) => sections.push({ title, sub, items, opts });

// ── hair (final picks, 2026-11-04: pro_hair.html, pro_hair2.html, storm_options.html) ──
const stopsOf = (stops) => stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('');
const linG = (id, stops, x1, y1, x2, y2) => `<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${stopsOf(stops)}</linearGradient>`;
const radG = (id, stops, cx = .5, cy = .5, r = .6) => `<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${stopsOf(stops)}</radialGradient>`;
const blur = (id, r) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${r}"/></filter>`;
function celG(key, d, base, lit, inner = '', w = 3.4, dx = -9, dy = -6) {
  const c = ID() + key;
  return `<clipPath id="${c}"><path d="${d}"/></clipPath><g clip-path="url(#${c})"><path d="${d}" fill="${base}"/>` +
    `<path d="${d}" fill="${lit}" transform="translate(${dx} ${dy})"/>${inner}</g><path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round"/>`;
}

// ── H1 Inferno: the hair is fire, swept up and back, the tongues leaning right.
function inferno() {
  const lit = ID(), core = ID(), gl = ID();
  const d = 'M64 66 C56 50 58 34 68 24 C68 34 72 40 78 38 C74 24 80 10 92 2 C92 14 96 22 104 20 C104 10 112 0 126 -4 C120 8 122 18 130 24 C136 18 140 10 142 4 C146 18 144 30 140 40 C144 46 142 56 136 66 C128 52 116 46 100 48 C84 46 72 52 64 66 Z';
  const tongues = 'M78 50 C76 40 80 32 86 28 C86 36 90 40 96 38 C94 28 100 18 108 14 C106 24 110 30 116 30 C118 22 124 16 132 14 C128 24 130 34 128 44 C118 40 92 42 78 50 Z';
  const defs = `<defs>${linG(lit, [[0, '#FFE45C'], [.45, '#FF9A1F'], [1, '#F0441C']], 0, 1, 0, 0)}${linG(core, [[0, '#FFFBE0'], [1, '#FFD23F']], 0, 1, 0, 0)}${blur(gl, 5)}</defs>`;
  const front = `<path d="${d}" fill="#FF6A1F" opacity=".55" filter="url(#${gl})"/>` +
    celG('f', d, '#B3261E', `url(#${lit})`, `<path d="${tongues}" fill="url(#${core})" opacity=".95"/>` + ink('M84 36 C86 30 90 26 92 22 M110 26 C112 20 118 16 122 14', 2, 0.6, '#FFFBE0')) +
    ['M146 30 L148 26', 'M60 30 L58 26', 'M136 -2 L138 -6'].map(p => `<path d="${p}" stroke="#FFD23F" stroke-width="3" stroke-linecap="round"/>`).join('');
  return { back: '', front, defs };
}


// ── H4 Neon dreads: locs to the shoulders, every tip lit.
function neonDreads() {
  const gl = ID(), lit = ID();
  const tips = ['#FF3DD8', '#3DE0FF', '#FF3DD8', '#3DE0FF', '#FF3DD8', '#3DE0FF'];
  const locs = [[62, 52, 54, 118], [70, 50, 64, 126], [78, 48, 76, 122], [122, 48, 124, 122], [130, 50, 136, 126], [138, 52, 146, 118]];
  let back = '';
  locs.forEach(([x1, y1, x2, y2], k) => {
    back += `<path d="M${x1} ${y1} C${x1 - 2} ${(y1 + y2) / 2} ${x2 + 2} ${(y1 + y2) / 2} ${x2} ${y2}" stroke="${INK}" stroke-width="12" stroke-linecap="round" fill="none"/>` +
      `<path d="M${x1} ${y1} C${x1 - 2} ${(y1 + y2) / 2} ${x2 + 2} ${(y1 + y2) / 2} ${x2} ${y2}" stroke="#1C1414" stroke-width="7.5" stroke-linecap="round" fill="none"/>` +
      `<path d="M${x1 - 1.5} ${y1 + 4} C${x1 - 3} ${(y1 + y2) / 2} ${x2} ${(y1 + y2) / 2} ${x2 - 1.5} ${y2 - 6}" stroke="#3A2C2C" stroke-width="2" stroke-linecap="round" fill="none"/>` +
      `<circle cx="${x2}" cy="${y2}" r="7" fill="${tips[k]}" filter="url(#${gl})" opacity=".9"/><circle cx="${x2}" cy="${y2}" r="4.4" fill="${tips[k]}" stroke="${INK}" stroke-width="1.6"/><circle cx="${x2 - 1.2}" cy="${y2 - 1.2}" r="1.4" fill="#fff"/>`;
  });
  const cap = 'M62 62 C60 36 78 24 100 24 C122 24 140 36 138 62 C130 50 116 44 100 46 C84 44 70 50 62 62 Z';
  const ridges = 'M74 34 C80 40 80 48 78 54 M86 28 C90 36 90 44 88 50 M100 26 L100 46 M114 28 C110 36 110 44 112 50 M126 34 C120 40 120 48 122 54';
  const defs = `<defs>${blur(gl, 3)}${linG(lit, [[0, '#3A2C2C'], [1, '#1C1414']], 0, 0, 0, 1)}</defs>`;
  const front = celG('f', cap, '#0E0A0A', `url(#${lit})`, ink(ridges, 2.2, 0.8, '#0A0707')) +
    [[88, 36, '#FF3DD8'], [112, 36, '#3DE0FF']].map(([x, y, c]) => `<rect x="${x - 4}" y="${y - 3}" width="8" height="6" rx="2" fill="${c}" stroke="${INK}" stroke-width="1.4"/>`).join('');
  return { back, front, defs };
}


// ── the afro, one cloud of hair.
// Outer edge: bumps along an ellipse over the top, from beside one ear to
// beside the other. Inner edge: a hairline that is hair meeting skin — the
// temples, a soft forehead line, down in front of the ears.
function afroShape() {
  // Ends above the ears: no hair beside or behind them (the user, 2026-11-04).
  const cx = 100, cy = 44, rx = 58, ry = 50;
  const a0 = Math.PI * 0.87, a1 = Math.PI * 2.13, n = 15;
  const pt = (a) => [cx + rx * Math.cos(a), cy + ry * Math.sin(a)];
  const f = (v) => v.toFixed(1);
  const [sx, sy] = pt(a0), [ex, ey] = pt(a1);
  let [x, y] = [sx, sy];
  let d = `M${f(sx)} ${f(sy)}`;
  for (let k = 1; k <= n; k++) {
    const [x2, y2] = pt(a0 + (a1 - a0) * k / n);
    const r = Math.hypot(x2 - x, y2 - y) * 0.62;
    d += ` A${f(r)} ${f(r)} 0 0 1 ${f(x2)} ${f(y2)}`;
    [x, y] = [x2, y2];
  }
  // Under the right end, in to the temple, the hairline across, out again.
  d += ` C${f(ex - 2)} ${f(ey + 4)} 140 68 134 67 C126 56 114 50 100 50 C86 50 74 56 66 67 C60 68 ${f(sx + 2)} ${f(sy + 4)} ${f(sx)} ${f(sy)} Z`;
  return d;
}
// Little coils in the hair, so it reads as hair and not as a solid.
const coils = (col, o) => [[70, 24], [86, 14], [104, 10], [122, 16], [136, 28], [62, 42], [78, 34], [96, 28], [114, 30], [130, 42], [144, 54], [56, 60], [72, 50], [140, 70], [58, 76]]
  .map(([x, y]) => `<path d="M${x - 3} ${y + 1} C${x - 3} ${y - 3} ${x + 3} ${y - 3} ${x + 3} ${y + 1} C${x + 3} ${y + 4} ${x - 1} ${y + 4} ${x - 1} ${y + 1}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linecap="round" opacity="${o}"/>`).join('');


function galaxyAfro() {
  const lit = ID();
  const d = afroShape();
  const defs = `<defs>${radG(lit, [[0, '#8A5CFF'], [.55, '#4A26B8'], [1, '#2A1670']], .42, .3, .75)}</defs>`;
  const sky = [[76, 22, 1.6], [92, 14, 1.2], [110, 22, 1.8], [126, 16, 1.3], [138, 34, 1.4], [84, 40, 1.1], [118, 38, 1], [64, 50, 1.1], [146, 58, 1.2]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff"/>`).join('') +
    `<path d="M100 4 L102.4 11 L109 13 L102.4 15 L100 22 L97.6 15 L91 13 L97.6 11 Z" fill="#FFE9A8"/>` +
    `<ellipse cx="130" cy="24" rx="7" ry="2.2" fill="none" stroke="#FFB3E1" stroke-width="1.5" transform="rotate(-20 130 24)"/><circle cx="130" cy="24" r="3.6" fill="#FF8FC8"/>`;
  const draw = () => celG('f', d, '#1A0E4A', `url(#${lit})`, coils('#B79CFF', 0.4) + sky);
  return { back: '', front: draw(), defs };
}


// C: no mohawk at all: a short crew, a lit lightning bolt shaved into each side.
function boltFade() {
  const gl = ID();
  const crew = 'M64 64 C62 38 80 26 100 26 C120 26 138 38 136 64 C130 50 118 44 100 46 C82 44 70 50 64 64 Z';
  const boltL = 'M74 40 L68 50 L73 50 L67 60';
  const boltR = 'M126 40 L132 50 L127 50 L133 60';
  const front = celG('c', crew, '#0E0A0A', '#2A2020', ink('M78 34 C88 28 112 28 122 34', 2, 0.4, '#fff')) +
    `<g filter="url(#${gl})">${ink(boltL + ' ' + boltR, 4.2, 1, '#4FD8FF')}</g>` + ink(boltL + ' ' + boltR, 2, 1, '#E6FDFF');
  return { back: '', front, defs: `<defs>${blur(gl, 2.2)}</defs>` };
}

const hairTile = (make, who = base) => () => { const x = make(); return compose(who, { defs: x.defs, hairBack: x.back, hairFront: x.front }, 'head'); };
add('الشعر', 'H — مفيش ولا شعر Pro دلوقتي (الأفرو العادي كمان هيترسم بنفس شكل H2)', [
  ['H1', 'Inferno', hairTile(inferno)],
  ['H2', 'Galaxy afro', hairTile(galaxyAfro, dark)],
  ['H3', 'Bolt fade', hairTile(boltFade)],
  ['H4', 'Neon dreads', hairTile(neonDreads, dark)],
]);

// ── hair colour ──
const colourHair = (stops, extra = '', who = base, dir = [1, 1]) => () => { const g = ID(); return compose(who, { defs: `<defs>${lin(g, stops, dir[0], dir[1])}</defs>`,
  hairFront: inked(CREWD, `url(#${g})`) + extra, brows: `<path d="M74 66 L96 72 L96 78 L75 73 Z M126 66 L104 72 L104 78 L125 73 Z" fill="url(#${g})" stroke="${INK}" stroke-width="2.2"/>` }, 'head'); };
add('لون الشعر', 'C — يتلبس على أي قصة. مفيش لون Pro دلوقتي', [
  ['C1', 'Chrome', colourHair(['#2E3842', '#FFFFFF', '#6E7A86', '#F4F8FB', '#3E4A56'], ink('M74 42 C86 32 106 30 122 36', 3.4, 0.95, '#fff') + spark(118, 34, 0.8))],
  ['C2', 'Gold leaf', colourHair(['#7A4E06', '#FFEFA8', '#D3961A', '#FFF8D6', '#9C6408'], ink('M74 42 C86 32 106 30 122 36', 3.2, 0.9, '#FFFBE6') + spark(84, 36, 0.8, '#FFFBE6'), dark)],
  ['C3', 'Neon fade', colourHair(['#FF4FD8', '#A65CFF', '#4FD8FF'], '', base, [1, 0.5])],
  ['C4', 'Sunset fade', colourHair(['#3B1C6E', '#C2368A', '#FF7A3D', '#FFD36B'], '', light, [0, 1])],
]);

// ── beards ──
const braid = (x) => [0, 1, 2].map(k => `<ellipse cx="${x + (k % 2 ? 1.2 : -1.2)}" cy="${114 + k * 7}" rx="4.6" ry="5" fill="#3A2416" stroke="${INK}" stroke-width="1.8"/>`).join('') +
  [0, 1].map(k => `<rect x="${x - 5.5}" y="${116 + k * 7}" width="11" height="3.6" rx="1.6" fill="#F2C14E" stroke="${INK}" stroke-width="1.4"/>`).join('') + spark(x + 6, 116, 0.5, '#FFFBE6');
add('الدقن', 'B — مفيش ولا دقن Pro دلوقتي', [
  ['B1', 'Flame beard', () => { const g = ID(); return compose(base, { defs: `<defs>${lin(g, FIRE.slice().reverse())}</defs>`,
    beard: inked('M66 80 C66 104 72 116 80 124 C80 134 86 142 90 132 C94 148 100 152 104 138 C110 150 118 142 116 130 C126 120 134 104 134 80 C130 96 122 104 112 104 C106 100 94 100 88 104 C78 104 70 96 66 80 Z', `url(#${g})`), mouth: mouth(1) }, 'head'); }],
  ['B2', 'Gold braids', () => compose(dark, { beard: cel('bb' + ID(), 'bd', FULLB, '#2A1A10') + braid(90) + braid(110), mouth: mouth(2) }, 'head')],
  ['B3', 'Frost', () => { const g = ID(); return compose(light, { defs: `<defs>${lin(g, ['#FFFFFF', '#CDEFFF', '#8CCBEB'])}</defs>`,
    beard: inked(FULLB, `url(#${g})`) + spark(84, 116, 0.8) + spark(116, 112, 0.7) + spark(100, 124, 0.6), mouth: mouth(1) }, 'head'); }],
  ['B4', 'Neon edge', () => { const f = ID(); return compose(dark, { defs: `<defs>${glow(f, 2.5)}</defs>`,
    beard: `<path d="${FULLB}" fill="#120E1E"/><path d="${FULLB}" fill="none" stroke="#FF3DD8" stroke-width="5" filter="url(#${f})"/><path d="${FULLB}" fill="none" stroke="#FFB3F2" stroke-width="2"/>`, mouth: mouth(8) }, 'head'); }],
]);

// ── mouths ──
const teethBox = 'M86 104 L114 104 L112 111 L88 111 Z';
add('البُق', 'M — مفيش بُق Pro دلوقتي (السنة الدهب والـgrill الألماظ بيتكسبوا)', [
  ['M1', 'Neon guard', () => { const f = ID(); return compose(base, { defs: `<defs>${glow(f, 2.2)}</defs>`,
    mouth: `<path d="M85 102.5 L115 102.5 L113 112 L87 112 Z" fill="#39FF88" filter="url(#${f})"/>` + `<path d="M85 102.5 L115 102.5 L113 112 L87 112 Z" fill="#39FF88" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>` + ink('M89 106 L104 106', 1.6, 0.9, '#E9FFF1') }, 'face'); }],
  ['M2', 'Fangs', () => compose(light, { mouth: `<path d="M86 103 C92 112 108 112 114 103 Z" fill="#3a1410" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/>` +
    `<path d="M88.5 103.5 L92 112 L95.5 104 Z M111.5 103.5 L108 112 L104.5 104 Z" fill="#fff" stroke="${INK}" stroke-width="1.2"/>` }, 'face')],
  ['M3', 'Fire breath', () => { const g = ID(), f = ID();
    const outer = 'M106 108 C116 102 128 98 140 92 C150 88 160 90 170 84 C166 92 172 96 180 96 C172 102 176 108 184 112 C174 114 166 120 158 118 C150 124 138 122 130 120 C122 118 114 116 106 112 Z';
    const core = 'M107 109 C118 106 130 103 142 100 C152 98 160 100 166 98 C160 104 158 108 164 112 C152 112 142 114 132 113 C122 112 114 111 107 111 Z';
    return compose(dark, { defs: `<defs><linearGradient id="${g}" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#E8401C"/><stop offset=".5" stop-color="#FF8A1F"/><stop offset="1" stop-color="#FFD23F"/></linearGradient>${glow(f, 4)}</defs>`,
      mouth: `<ellipse cx="102" cy="108" rx="6.5" ry="6" fill="#3a1410" stroke="${INK}" stroke-width="2.6"/>` +
        `<path d="${outer}" fill="#FF6A1F" opacity=".7" filter="url(#${f})"/>` + inked(outer, `url(#${g})`, 2.2) + `<path d="${core}" fill="#FFF6C2" opacity=".9"/>` +
        `<circle cx="176" cy="88" r="2" fill="#FFD23F"/><circle cx="186" cy="104" r="1.6" fill="#FFD23F"/><circle cx="168" cy="124" r="1.8" fill="#FF8A1F"/>` }, 'face'); }],
  ['M4', 'Neon smile', () => { const f = ID(); return compose(base, { defs: `<defs>${glow(f, 2.4)}</defs>`,
    mouth: `<path d="M86 102 C92 113 108 113 114 102 Z" fill="none" stroke="#00E5FF" stroke-width="7" filter="url(#${f})"/><path d="M86 102 C92 113 108 113 114 102 Z" fill="#B8FBFF" stroke="#00B8D4" stroke-width="2.4" stroke-linejoin="round"/>` + ink('M88 105 L112 105', 1.2, 0.9, '#0B6A78') }, 'face'); }],
]);

// ── face marks ──
add('علامات الوش', 'F — مفيش علامة Pro دلوقتي', [
  ['F1', 'Circuit', () => { const f = ID(); const d = 'M128 64 L128 76 L121 83 L121 96 M121 90 L129 98 L129 108'; return compose(base, { defs: `<defs>${glow(f, 1.8)}</defs>`,
    marks: `<g filter="url(#${f})">${ink(d, 3.2, 1, '#3DF2FF')}</g>` + ink(d, 1.4, 1, '#E8FFFF') + [[128, 64], [121, 96], [129, 108]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.4" fill="#E8FFFF" stroke="#3DF2FF" stroke-width="1.2"/>`).join('') }, 'face'); }],
  ['F2', 'Lightning bolt', () => compose(light, { marks: inked('M84 60 L76 82 L86 82 L78 104 L98 76 L88 76 L96 60 Z', '#FF3B3B', 2) + ink('M86 62 L80 78', 1.4, 0.8, '#7FB2FF') }, 'face')],
  ['F3', 'Face gems', () => compose(dark, { marks: [[82, 92], [88, 95], [94, 92], [106, 92], [112, 95], [118, 92]].map(([x, y]) =>

  inked(`M${cx - 12} ${cy - 2} C${cx - 20} ${cy - 2} ${cx - 20} ${cy + 8} ${cx - 11} ${cy + 8}`, `url(#${g})`, 2.2) +
  `<rect x="${cx - 9}" y="${cy + 12}" width="17" height="7" rx="2" fill="#F5EFE4" stroke="${INK}" stroke-width="2"/>` + ink(`M${cx - 4} ${cy - 12} C${cx} ${cy - 15} ${cx + 6} ${cy - 13} ${cx + 8} ${cy - 9}`, 2, 0.9, '#FFFBE6') + `</g>`;
add('الإكسسوارات', 'G — Pro دلوقتي: 5 (التاج والهالة والإكليل والقرون والحزام بيتكسبوا)', [
  ['G1', 'Gold aviators', () => { const g = ID(), r = ID(); return compose(base, { defs: `<defs>${lin(g, ['#FF9A3D', '#C2368A', '#3D5BD8'])}${lin(r, ['#FFF3B8', '#D99A1E'])}</defs>`,

    `<g opacity=".16" fill="#fff"><path d="M40 -20 L70 -20 L30 220 L0 220 Z"/><path d="M110 -20 L130 -20 L120 220 L90 220 Z"/><path d="M170 -20 L190 -20 L220 220 L190 220 Z"/></g>` +
    [[30, 150, 5], [40, 130, 3], [36, 112, 2], [170, 140, 4], [176, 120, 2.5], [160, 104, 2]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#DFFBFF" stroke-width="1.4" opacity=".8"/>`).join('') }); }],
  ['P4', 'Confetti', () => compose(base, { bg: rect('#1E1B2E') +
    Array.from({ length: 34 }, (_, k) => { const x = (k * 53) % 200, y = (k * 37) % 200, c = ['#FF5A8A', '#FFE45C', '#5AD8FF', '#7CFF8A', '#B98CFF'][k % 5]; return `<rect x="${x}" y="${y}" width="7" height="3.5" rx="1" fill="${c}" transform="rotate(${(k * 41) % 180} ${x} ${y})"/>`; }).join('') +

]);

  ['V1', 'Fireworks', () => { const g = ID(); return cover(`<defs>${lin(g, ['#0B0A2A', '#2A1650'])}</defs><rect width="412" height="140" fill="url(#${g})"/>` +
    [[110, 46, '#FF5A8A'], [210, 30, '#FFE45C'], [300, 52, '#5AD8FF']].map(([x, y, c]) => Array.from({ length: 12 }, (_, k) => { const a = k * Math.PI / 6; return `<path d="M${x + 6 * Math.cos(a)} ${y + 6 * Math.sin(a)} L${x + 26 * Math.cos(a)} ${y + 26 * Math.sin(a)}" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`; }).join('') + `<circle cx="${x}" cy="${y}" r="4" fill="#fff"/>`).join('') +
    `<path d="M0 140 L0 110 L40 104 L60 116 L100 100 L150 112 L200 98 L260 114 L300 102 L350 116 L412 104 L412 140 Z" fill="#0A0814"/>` + `<rect x="60" y="112" width="290" height="28" fill="#141024"/>` + Array.from({ length: 14 }, (_, k) => `<rect x="${70 + k * 20}" y="118" width="10" height="6" fill="#FFE08A" opacity=".7"/>`).join('')); }],
  ['V2', 'Fight night', () => cover(`<rect width="412" height="140" fill="#0E0C0B"/>` +
    `<path d="M120 0 L60 140 L352 140 L292 0 Z" fill="#FFF3D0" opacity=".12"/><path d="M180 0 L150 140 L262 140 L232 0 Z" fill="#FFF3D0" opacity=".16"/>` +
    Array.from({ length: 30 }, (_, k) => `<circle cx="${k * 14 + 4}" cy="${62 + (k % 3) * 3}" r="6" fill="#1E1A18"/>`).join('') +
    Array.from({ length: 12 }, (_, k) => `<circle cx="${20 + k * 34}" cy="${30 + (k % 2) * 6}" r="1.6" fill="#FFF3D0"/>`).join('') +

  ['V3', 'Orbit', () => { const g = ID(), e = ID(), f = ID(); return cover(`<defs>${lin(g, ['#020414', '#0B1440'])}<radialGradient id="${e}" cx=".5" cy=".2" r=".8"><stop offset="0" stop-color="#2F86E8"/><stop offset=".6" stop-color="#123E8C"/><stop offset="1" stop-color="#061A40"/></radialGradient>${glow(f, 6)}</defs>` +
    `<rect width="412" height="140" fill="url(#${g})"/>` + stars([[30, 20], [80, 40, 1.3], [140, 16], [220, 30], [300, 18, 1.2], [360, 44], [390, 14], [250, 54, 0.8]], 1.3) +
    `<circle cx="206" cy="600" r="510" fill="none" stroke="#7FD3FF" stroke-width="10" filter="url(#${f})"/>` + `<circle cx="206" cy="600" r="510" fill="url(#${e})"/>` +
    `<path d="M60 120 C90 108 130 112 150 118 C170 124 140 132 110 130 C90 130 70 128 60 120 Z M250 106 C270 100 300 102 310 108 C300 114 270 114 250 106 Z" fill="#EAF6FF" opacity=".55"/>` +
    spark(340, 60, 1.6, '#FFE7B0') + `<circle cx="340" cy="60" r="10" fill="#FFE7B0" opacity=".25"/>`); }],
  ['V4', 'Champion podium', () => cover(`<rect width="412" height="140" fill="#1A1418"/>` +
    `<path d="M206 0 L150 140 L262 140 Z" fill="#FFE08A" opacity=".12"/>` +
    `<rect x="166" y="76" width="80" height="64" fill="#F2C14E" stroke="${INK}" stroke-width="3"/><rect x="96" y="96" width="70" height="44" fill="#C9D2DB" stroke="${INK}" stroke-width="3"/><rect x="246" y="106" width="70" height="34" fill="#D08A4E" stroke="${INK}" stroke-width="3"/>` +
    `<text x="206" y="118" text-anchor="middle" font-family="Arial" font-weight="900" font-size="30" fill="${INK}">1</text>` +
    Array.from({ length: 40 }, (_, k) => { const x = (k * 47) % 412, y = (k * 29) % 90, c = ['#FF5A8A', '#FFE45C', '#5AD8FF', '#7CFF8A'][k % 4]; return `<rect x="${x}" y="${y}" width="6" height="3" fill="${c}" transform="rotate(${k * 37 % 180} ${x} ${y})"/>`; }).join(''))],
], { wide: true });

const out = document.getElementById('out');
out.innerHTML = sections.map(s => `<div class="sec"><h2>${s.title}<span>${s.sub}</span></h2><div class="row">${s.items.map(([code, name, draw]) =>
  s.opts.wide ? `<div class="tile wide"><div class="pic">${draw()}</div><div class="meta"><span class="code">${code}</span><span class="name">${name}</span><span class="pro">PRO</span></div></div>`
              : `<div class="tile"><div class="pic">${draw()}</div><div><div class="code">${code}</div><div class="name">${name}</div><div class="pro">PRO</div></div></div>`).join('')}</div></div>`).join('');
</script>
</body>
