<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#121110;color:#F5EFE4;font-family:Manrope,sans-serif;position:relative}
.glow{position:absolute;right:-120px;top:-60px;width:820px;height:760px;background:radial-gradient(closest-side,rgba(232,132,107,.22),transparent)}
.glow2{position:absolute;left:-200px;top:200px;width:700px;height:600px;background:radial-gradient(closest-side,rgba(224,177,69,.10),transparent)}
.brand{position:absolute;left:72px;top:64px;display:flex;align-items:center;gap:14px;font:900 30px Archivo;font-stretch:125%;letter-spacing:.06em}
.brand img{width:46px;height:46px;border-radius:12px}
.kicker{position:absolute;left:72px;top:150px;display:flex;align-items:center;gap:10px;font:800 15px Manrope;letter-spacing:.22em;color:#E8846B;text-transform:uppercase}
.kicker:before{content:"";width:9px;height:9px;border-radius:50%;background:#E8846B;box-shadow:0 0 12px #E8846B}
h1{position:absolute;left:68px;top:184px;font:900 104px/0.9 Archivo;font-stretch:125%;text-transform:uppercase;letter-spacing:-.02em}
h1 span{color:#E8846B;display:block}
.sub{position:absolute;left:72px;top:476px;font:600 24px Manrope;color:#CFC7BB;width:600px;line-height:1.35}
.url{position:absolute;left:72px;bottom:34px;font:800 17px Manrope;letter-spacing:.24em;color:#9A928A}
.stage{position:absolute;left:760px;top:-6px;width:400px;height:660px;perspective:1600px}
.phone{position:absolute;left:84px;top:44px;width:250px;height:542px;border-radius:40px;background:#0b0a09;padding:8px;box-shadow:0 0 0 2px #3A3631,0 40px 80px rgba(0,0,0,.6),0 0 90px rgba(232,132,107,.25);transform:rotateY(-18deg) rotateX(6deg) rotate(2deg)}
.phone div{width:100%;height:100%;border-radius:33px;background:url(assets/home/live.webp) center top/cover no-repeat}
.float{position:absolute;z-index:2;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:rgba(28,26,24,.92);border:1px solid rgba(245,239,228,.16);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.float b{font:900 26px/1 Archivo;font-stretch:125%}
.float small{display:block;color:#9A928A;font-size:13px;margin-top:3px}
.crest{width:44px;height:44px;display:grid;place-items:center}
.crest svg{width:44px;height:auto}
.r{left:-38px;top:96px;transform:rotate(-4deg)}
.c{left:-58px;top:404px;transform:rotate(-3deg);flex-direction:column;align-items:flex-start;gap:6px;width:228px}
.c .t{font:800 11px Manrope;letter-spacing:.16em;color:#E8846B}
.c b{font-size:28px;line-height:.95;text-transform:uppercase}
.c i{font-style:normal;margin-top:4px;background:#E8846B;color:#1A0F0B;font:800 12px Manrope;padding:5px 12px;border-radius:999px}
.p{right:-22px;top:212px;transform:rotate(4deg);flex-direction:column;align-items:stretch;gap:6px;width:200px}
.p .row{display:flex;justify-content:space-between;font:800 14px Manrope}
.p .ok{color:#4CC38A;font-size:13px}
.lv{right:6px;top:470px;transform:rotate(3deg)}
.lv .dot{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#262320;font:900 13px Archivo;font-stretch:125%;color:#E0B145}
</style></head><body>
<div class="glow"></div><div class="glow2"></div>
<div class="brand"><img src="assets/favicon.png" alt="">OUTREPD</div>
<div class="kicker">Live 1v1 push-up challenge app</div>
<h1>Outrep<br>anyone.<span>Live.</span></h1>
<p class="sub">Race real people, dare friends with a link, beat last week’s you.</p>
<div class="url">OUTREPD.COM</div>
<div class="stage">
  <div class="phone"><div></div></div>
  <div class="float r"><span class="crest" data-badge="3" data-size="44"></span><div><b>+32</b><small>rating · Gold III</small></div></div>
  <div class="float p"><div class="row"><span>Road to 36</span><span class="ok">On track</span></div>
    <svg viewBox="0 0 188 70" width="168" height="62"><line x1="8" y1="60" x2="180" y2="10" stroke="#3A3631" stroke-width="2" stroke-dasharray="4 5"/><polyline points="8,60 37,52 66,40" fill="none" stroke="#E8DCC8" stroke-width="3"/><circle cx="66" cy="40" r="5.5" fill="#E8DCC8"/><circle cx="180" cy="10" r="5" fill="none" stroke="#E0B145" stroke-width="2.5"/></svg>
    <small>Beat last week’s you</small></div>
  <div class="float c"><span class="t">CHALLENGE LINK</span><b>Can you beat 18?</b><i>outrepd.com/c/k7f2</i></div>
  <div class="float lv"><span class="dot">Lv</span><div><b>12</b><small>+38 XP</small></div></div>
</div>
<script src="u/crest.js"></script>
<script>document.querySelectorAll('[data-badge]').forEach(function(el){el.innerHTML=window.OutrepdCrest.badge(+el.dataset.badge,+el.dataset.size);});</script>
</body></html>
