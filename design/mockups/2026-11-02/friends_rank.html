<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Friends Ranking</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #070605; color: #F5EFE4; font-family: 'Noto Sans', sans-serif; }
  .wrap { padding: 22px 24px 30px; width: 1000px; }
  .cap { direction: rtl; font-family: 'Noto Sans Arabic', 'Noto Sans', sans-serif; margin-bottom: 12px; }
  .cap b { display: block; font-size: 22px; margin-bottom: 6px; }
  .cap p { margin: 0; color: #8F8880; font-size: 15px; line-height: 1.7; }
  .row { display: flex; gap: 40px; justify-content: center; }
  .lab { direction: rtl; font-family: 'Noto Sans Arabic', sans-serif; text-align: center; font-size: 18px; margin-bottom: 8px; color: #8F8880; }
  .lab.b { color: #E8DCC8; font-weight: 700; }
  .phone { position: relative; width: 412px; height: 915px; border-radius: 30px; overflow: hidden; outline: 1px solid #2a2724; background: #111010; flex: none; }
  .phone img.shot { position: absolute; inset: 0; width: 412px; height: 915px; }
  .crop { position: absolute; background-repeat: no-repeat; }
  .abs { position: absolute; }
  .num { font-variant-numeric: tabular-nums; }
</style>
</head>
<body data-p="a">
<div class="wrap">
  <div class="cap"><b id="title"></b><p id="sub"></p></div>
  <div class="row">
    <div><div class="lab" id="nowlab">دلوقتي</div><div class="phone" id="now"></div></div>
    <div><div class="lab b" id="optlab"></div><div class="phone" id="opt"></div></div>
  </div>
</div>
<script>
  const page = document.body.dataset.p;
  const MUTED = 'rgba(245,239,228,.5)', CREAM = '#E8DCC8', GOLD = '#D9A94A', SURF = '#1A1918', RAISED = '#262421', LINE = 'rgba(255,255,255,.07)';
  const el = (p, css, html) => { const d = document.createElement('div'); d.className = 'abs'; Object.assign(d.style, css); if (html != null) d.innerHTML = html; p.appendChild(d); return d; };
  const crop = (p, src, x0, y0, w, h, x, y, s = 1, blend = true) => { const d = el(p, { left: x + 'px', top: y + 'px', width: w * s + 'px', height: h * s + 'px', backgroundImage: `url(${src})`, backgroundSize: `${412 * s}px ${915 * s}px`, backgroundPosition: `${-x0 * s}px ${-y0 * s}px` }); if (blend) d.style.mixBlendMode = 'lighten'; d.className = 'crop'; return d; };
  const card = { background: SURF, borderRadius: '16px' };
  const lv = (n) => `<span style="font-size:11px;font-weight:700;color:rgba(245,239,228,.6);background:${RAISED};border-radius:6px;padding:1px 6px">Lv ${n}</span>`;
  const you = `<span style="font-size:11px;font-weight:700;background:${CREAM};color:#141210;border-radius:6px;padding:1px 6px">YOU</span>`;
  const globe = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="${CREAM}" stroke-width="2"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c3 3.2 3 15.8 0 19M12 2.5c-3 3.2-3 15.8 0 19"/></svg>`;
  const people = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${CREAM}" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c2.9.2 5 2.3 5 5.3"/></svg>`;
  const caret = `<svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" stroke="${MUTED}" stroke-width="1.6" fill="none"/></svg>`;
  const info = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="${CREAM}" stroke-width="2"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.2v.2"/></svg>`;
  const chev = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${MUTED}" stroke-width="2.2"><path d="M9 5l7 7-7 7"/></svg>`;
  const check = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${CREAM}" stroke-width="2.4"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
  const segmented = (p, top, items, on, h = 44) => el(p, Object.assign({ left: '16px', right: '16px', top: top + 'px', height: h + 'px', padding: '4px', display: 'flex', gap: '4px' }, card, { borderRadius: '14px' }),
    items.map((t, i) => `<div style="flex:1;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:14.5px;font-weight:${i === on ? 700 : 500};${i === on ? `background:${CREAM};color:#141210` : 'color:rgba(245,239,228,.55)'}">${t}</div>`).join(''));
  const titleRow = (p, button) => {
    el(p, { left: '20px', top: '18px', fontSize: '28px', fontWeight: 700 }, 'Ranks');
    if (button) el(p, Object.assign({ right: '16px', top: '22px', height: '34px', padding: '0 12px', display: 'flex', alignItems: 'center', gap: '7px', fontSize: '13.5px', fontWeight: 600 }, card, { borderRadius: '12px' }), button);
  };
  const M = 'now/tab_ranks_month.png', T = 'now/tab_ranks_top.png', F = 'now/friends_b.png';
  const AV = { delt: [M, 619], newbie: [T, 603], iron: [T, 173], squat: [T, 259], bench: [T, 345], me: [M, 857] };
  const avatar = (p, who, x, y) => { const [src, cy] = AV[who]; crop(p, src, who === 'me' ? 29 : 69, cy - 24, 74, 48, x, y); };
  const medal = { 1: GOLD, 2: '#A9A39A', 3: '#B87A4E' };
  // The friends' week: you among them, inline.
  const board = [[1, 'squat', 'squat_queen', 19, 'Platinum V', 142], [2, 'iron', 'iron_mike', 22, 'Diamond III', 131], [3, 'me', 'demo_lifter', 12, 'Gold III', 118], [4, 'bench', 'benchgod', 15, 'Gold III', 104], [5, 'delt', 'delt_destroyer', 10, 'Gold I', 61], [6, 'newbie', 'newbie_gains', 5, 'Bronze II', 0]];
  function rows(p, top, list) {
    el(p, Object.assign({ left: '16px', right: '16px', top: top + 'px', height: list.length * 64 + 'px' }, card));
    list.forEach(([pl, who, name, l, sub, pts], i) => {
      const y = top + i * 64;
      const mine = who === 'me';
      if (mine) el(p, { left: '20px', right: '20px', top: (y + 4) + 'px', height: '56px', borderRadius: '12px', border: `1.5px solid ${CREAM}`, background: 'rgba(232,220,200,.06)' });
      el(p, Object.assign({ left: '27px', top: (y + 17) + 'px', width: '30px', height: '30px', borderRadius: '15px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '14px', fontWeight: 700 }, medal[pl] ? { background: medal[pl], color: '#141210' } : { color: MUTED }), pl);
      avatar(p, who, 58, y + 8);
      el(p, { left: '140px', top: (y + 12) + 'px' }, `<div style="font-size:15.5px;font-weight:600;display:flex;gap:6px;align-items:center">${name} ${lv(l)} ${mine ? you : ''}</div><div style="font-size:12.5px;color:${MUTED};margin-top:2px">${sub}</div>`);
      el(p, { right: '30px', top: (y + 13) + 'px', textAlign: 'right' }, `<div class="num" style="font-size:17px;font-weight:700;color:${mine ? CREAM : '#F5EFE4'}">${pts}</div><div style="font-size:11px;color:${MUTED}">pts</div>`);
      if (i > 0 && !mine && list[i - 1][1] !== 'me') el(p, { left: '121px', right: '16px', top: y + 'px', height: '1px', background: LINE });
    });
  }
  const line = (p, top, text) => {
    el(p, { left: '20px', top: top + 'px', fontSize: '14px', color: MUTED }, text);
    el(p, { right: '20px', top: (top - 2) + 'px', display: 'flex', gap: '6px', alignItems: 'center', fontSize: '14px', fontWeight: 600, color: CREAM }, `${info} How points work`);
  };

  // A: Friends, a fourth board on the strip.
  function optA(p) {
    titleRow(p, null);
    segmented(p, 72, ['Week', 'Month', 'Overall', 'Friends'], 3);
    line(p, 130, 'This week · 6d 9h left');
    rows(p, 162, board);
    el(p, { left: '20px', right: '20px', top: '560px', fontSize: '13px', color: MUTED, textAlign: 'center' }, '13 pts to pass iron_mike');
    el(p, Object.assign({ left: '16px', right: '16px', top: '596px', height: '52px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', fontSize: '15px', fontWeight: 700, borderRadius: '14px', background: RAISED }), `${people} Add a friend`);
  }

  // B: Friends, a third place beside the world and the country.
  function optB(p) {
    titleRow(p, `${people} Friends ${caret}`);
    segmented(p, 72, ['Week', 'Month', 'Overall'], 0);
    line(p, 130, 'This week · 6d 9h left');
    rows(p, 162, board);
    // The choice, open over the page.
    el(p, { left: 0, right: 0, top: 0, bottom: 0, background: 'rgba(0,0,0,.55)' });
    el(p, { left: 0, right: 0, bottom: 0, height: '250px', background: SURF, borderRadius: '22px 22px 0 0' });
    el(p, { left: '186px', width: '40px', bottom: '232px', height: '4px', borderRadius: '2px', background: 'rgba(245,239,228,.25)' });
    [[`🌍 Global`, false], [`<span style="display:inline-block;width:20px;height:14px;border-radius:2px;position:relative;background:repeating-linear-gradient(#b22234 0 2px,#fff 2px 4px)"><span style="position:absolute;left:0;top:0;width:9px;height:8px;background:#3c3b6e"></span></span> United States`, false], [`${people.replace('16', '18').replace('16', '18')} Friends`, true]].forEach(([t, on], i) => {
      el(p, { left: '24px', right: '24px', bottom: (176 - i * 58) + 'px', height: '40px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontSize: '16px', fontWeight: 600 }, `<span style="display:flex;gap:8px;align-items:center">${t}</span>${on ? check : ''}`);
    });
  }

  // C: your place among friends, on the Friends tab.
  function optC(p) {
    crop(p, F, 0, 0, 412, 168, 0, 0, 1, false);
    const y = 180;
    el(p, Object.assign({ left: '12px', right: '12px', top: y + 'px', height: '118px' }, card));
    el(p, { left: '28px', top: (y + 14) + 'px', fontSize: '13px', fontWeight: 600, color: MUTED }, 'Among friends this week');
    el(p, { left: '28px', top: (y + 36) + 'px', display: 'flex', alignItems: 'baseline', gap: '10px' }, `<span class="num" style="font-size:38px;font-weight:800;color:${GOLD};line-height:1.05">#3</span><span style="font-size:15px;font-weight:600;color:${MUTED}">of 6</span>`);
    el(p, { left: '28px', top: (y + 86) + 'px', fontSize: '13px', color: MUTED }, '13 pts to pass iron_mike · 6d 9h left');
    [['squat', 0], ['iron', 1], ['me', 2]].forEach(([w, i]) => { const [src, cy] = AV[w]; crop(p, src, (w === 'me' ? 29 : 69) + 13, cy - 24, 48, 48, 236 + i * 36, y + 30, 0.92); });
    el(p, { right: '26px', top: (y + 51) + 'px' }, chev);
    // The rest of the tab, moved down.
    crop(p, F, 0, 168, 412, 747, 0, 310, 1, false);
  }

  const pages = {
    a: ['A · تاب "Friends" في الرانكات', 'تاب رابع في الشريط: Friends. بيرتّبك إنت وأصحابك بنقط الأسبوع ده، وإنت متعلّم وسطهم مش مثبت تحت. تحت الترتيب سطر بيقولك فاضلك قد إيه تعدّي اللي قدامك، وزرار تضيف صاحب.', optA, 'ranks_now', 'A · تاب Friends'],
    b: ['B · "Friends" مع العالم والبلد', 'الزرار اللي جنب العنوان بقى فيه 3 اختيارات: العالم، البلد، الأصحاب. تختار الأصحاب يبقى الأسبوع والشهر والعام كلهم بينك وبين أصحابك بس. الأقوى، بس مستخبي ورا الزرار.', optB, 'ranks_now', 'B · مع العالم والبلد'],
    c: ['C · كارت في تاب الأصحاب', 'في تاب الأصحاب نفسه، فوق اللسته: كارت "Among friends this week" فيه مكانك وسط أصحابك وفاضلك قد إيه تعدّي اللي قدامك. تدوس عليه يفتح الترتيب كامل (زي A).', optC, 'friends_b', 'C · في تاب الأصحاب'],
  };
  const [title, sub, draw, shot, lab] = pages[page];
  document.getElementById('title').textContent = title;
  document.getElementById('sub').textContent = sub;
  document.getElementById('optlab').textContent = lab;
  document.getElementById('now').innerHTML = `<img class="shot" src="now/${shot}.png">`;
  draw(document.getElementById('opt'));
</script>
</body>
</html>
