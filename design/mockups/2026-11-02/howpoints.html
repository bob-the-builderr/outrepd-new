<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>How Points Placement</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #070605; color: #F5EFE4; font-family: 'Noto Sans', sans-serif; }
  .wrap { padding: 22px 24px 30px; width: 1000px; }
  .cap { direction: rtl; font-family: 'Noto Sans Arabic', 'Noto Sans', sans-serif; margin-bottom: 12px; }
  .cap b { display: block; font-size: 22px; margin-bottom: 6px; }
  .cap p { margin: 0; color: #8F8880; font-size: 15px; line-height: 1.7; }
  .row { display: flex; gap: 40px; justify-content: center; }
  .lab { direction: rtl; font-family: 'Noto Sans Arabic', sans-serif; text-align: center; font-size: 18px; margin-bottom: 8px; color: #E8DCC8; font-weight: 700; }
  .phone { position: relative; width: 412px; height: 915px; border-radius: 30px; overflow: hidden; outline: 1px solid #2a2724; background: #111010; flex: none; }
  .phone img.shot { position: absolute; inset: 0; width: 412px; height: 915px; }
  .abs { position: absolute; }
</style>
</head>
<body data-p="a">
<div class="wrap">
  <div class="cap"><b id="title"></b><p id="sub"></p></div>
  <div class="row">
    <div><div class="lab">Week</div><div class="phone" id="w"></div></div>
    <div><div class="lab">Overall</div><div class="phone" id="o"></div></div>
  </div>
</div>
<script>
  const page = document.body.dataset.p;
  const MUTED = 'rgba(245,239,228,.5)', CREAM = '#E8DCC8', BG = '#111010', SURF = '#1A1918';
  const el = (p, css, html) => { const d = document.createElement('div'); d.className = 'abs'; Object.assign(d.style, css); if (html != null) d.innerHTML = html; p.appendChild(d); return d; };
  const info = (s = 15) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${CREAM}" stroke-width="2"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.2v.2"/></svg>`;
  const shot = (p, src) => { p.innerHTML = `<img class="shot" src="${src}">`; };
  // Covers the line under the strip, then draws the new one.
  const cover = (p, top, h) => el(p, { left: 0, right: 0, top: top + 'px', height: h + 'px', background: BG });

  // A: the link stays on the line, against the right edge; the text has the
  // rest. Overall's line keeps only the link (who is on it is in the sheet).
  function a(p, overall) {
    if (!overall) {
      cover(p, 114, 44);
      el(p, { left: '16px', top: '126px', fontSize: '14px', color: MUTED }, 'This week · 6d 9h left');
    } else {
      // Overall: the rows move up into the space the second line took.
      el(p, { left: 0, right: 0, top: '114px', bottom: '84px', background: BG });
      const img = el(p, { left: 0, right: 0, top: '156px', height: '480px', backgroundImage: 'url(ci_a/tab_ranks_top.png)', backgroundSize: '412px 915px', backgroundPosition: '0 -172px' });
    }
    el(p, { right: '16px', top: '124px', display: 'flex', gap: '6px', alignItems: 'center', fontSize: '14px', fontWeight: 600, color: CREAM }, `${info()} How points work`);
  }

  // B: a round ⓘ by the title, beside the place button; the line under the
  // strip is only the line.
  function b(p, overall) {
    el(p, { right: '16px', top: '11px', width: '36px', height: '36px', borderRadius: '18px', background: SURF, display: 'flex', alignItems: 'center', justifyContent: 'center' }, info(18));
    if (!overall) {
      cover(p, 114, 44);
      el(p, { left: '16px', top: '126px', fontSize: '14px', color: MUTED }, 'This week · 6d 9h left');
    } else {
      el(p, { left: 0, right: 0, top: '114px', bottom: '84px', background: BG });
      el(p, { left: '16px', top: '124px', fontSize: '14px', color: MUTED }, 'Players active in the last 30 days');
      el(p, { left: 0, right: 0, top: '156px', height: '480px', backgroundImage: 'url(ci_a/tab_ranks_top.png)', backgroundSize: '412px 915px', backgroundPosition: '0 -172px' });
    }
  }

  const pages = {
    a: ['A · في نفس السطر، لازقة في اليمين', 'الزرار في آخر السطر على اليمين، والكلام اللي على الشمال واخد باقي المساحة كلها فمبيتكسرش. في "Overall" السطر فيه الزرار بس، لأن "Players active in the last 30 days" موجودة جوه الشرح.', a],
    b: ['B · أيقونة ⓘ جنب العنوان', 'دايرة صغيرة ⓘ فوق جنب كلمة Ranks (وجنب زرار العالم/البلد/الأصحاب)، تفتح نفس الشرح. السطر اللي تحت الشريط بقى للكلام بس وواخد العرض كله.', b],
  };
  const [title, sub, draw] = pages[page];
  document.getElementById('title').textContent = title;
  document.getElementById('sub').textContent = sub;
  const w = document.getElementById('w'), o = document.getElementById('o');
  shot(w, 'ci_a/tab_ranks_month.png'); shot(o, 'ci_a/tab_ranks_top.png');
  draw(w, false); draw(o, true);
</script>
</body>
</html>
