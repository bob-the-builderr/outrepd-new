<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Ranks And Profile B</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #070605; color: #F5EFE4; font-family: 'Noto Sans', sans-serif; }
  .wrap { padding: 22px 24px 30px; width: 1000px; }
  .cap { direction: rtl; font-family: 'Noto Sans Arabic', 'Noto Sans', sans-serif; margin-bottom: 12px; }
  .cap b { display: block; font-size: 22px; margin-bottom: 6px; }
  .cap p { margin: 0; color: #8F8880; font-size: 15px; line-height: 1.7; }
  .row { display: flex; gap: 40px; justify-content: center; }
  .lab { direction: rtl; font-family: 'Noto Sans Arabic', sans-serif; text-align: center; font-size: 18px; margin-bottom: 8px; color: #8F8880; }
  .lab.b { color: #E8DCC8; font-weight: 700; }
  .phone { position: relative; width: 412px; height: 915px; border-radius: 30px; overflow: hidden; outline: 1px solid #2a2724; background: #111010; flex: none; }
  .phone img.shot { position: absolute; inset: 0; width: 412px; height: 915px; }
  .crop { position: absolute; background-repeat: no-repeat; background-size: 412px 915px; }
  .abs { position: absolute; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: rgba(245,239,228,.5); }
</style>
</head>
<body data-p="ranks">
<div class="wrap">
  <div class="cap"><b id="title"></b><p id="sub"></p></div>
  <div class="row">
    <div><div class="lab">دلوقتي</div><div class="phone" id="now"></div></div>
    <div><div class="lab b">B · بسيط ونضيف</div><div class="phone" id="pb"></div></div>
  </div>
</div>
<script>
  const page = document.body.dataset.p;
  const el = (p, css, html) => { const d = document.createElement('div'); d.className = 'abs'; Object.assign(d.style, css); if (html != null) d.innerHTML = html; p.appendChild(d); return d; };
  const crop = (p, src, x0, y0, w, h, x, y, blend) => { const d = el(p, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', backgroundImage: `url(${src})`, backgroundPosition: `${-x0}px ${-y0}px` }); d.className = 'crop'; if (blend) d.style.mixBlendMode = 'lighten'; return d; };
  const card = { background: '#1A1918', borderRadius: '16px' };
  const MUTED = 'rgba(245,239,228,.5)';
  const lv = (n) => `<span style="font-size:11px;font-weight:700;color:rgba(245,239,228,.6);background:#262421;border-radius:6px;padding:1px 6px">Lv ${n}</span>`;
  const segmented = (p, top, items, on, w, h = 44) => el(p, Object.assign({ left: w ? `calc(50% - ${w / 2}px)` : '16px', right: w ? 'auto' : '16px', width: w ? w + 'px' : 'auto', top: top + 'px', height: h + 'px', padding: '4px', display: 'flex', gap: '4px' }, card, { borderRadius: '14px' }),
    items.map((t, i) => `<div style="flex:1;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:${h > 40 ? 14.5 : 13.5}px;font-weight:${i === on ? 700 : 500};${i === on ? 'background:#E8DCC8;color:#141210' : 'color:rgba(245,239,228,.55)'}">${t}</div>`).join(''));
  // The bottom bar, exactly as the app draws it today.
  const navAsIs = (p, src) => crop(p, src, 0, 832, 412, 83, 0, 832);

  function ranks(p) {
    const S = 'now/tab_ranks_month.png';
    el(p, { left: '20px', top: '20px', fontSize: '28px', fontWeight: 700 }, 'Ranks');
    segmented(p, 70, ['This Season', 'Top Players', 'Your Tier'], 0);
    segmented(p, 126, ['Week', 'Month'], 0, 190, 36);
    el(p, { left: 0, right: 0, top: '176px', textAlign: 'center' }, `<div style="color:#D9A94A;font-size:16px;font-weight:600">This week · 7h left</div>
      <div style="display:flex;gap:6px;justify-content:center;margin-top:8px">${['Win +5', 'Loss −2', '3 wins in a row: +10'].map((t) => `<span style="font-size:12.5px;background:#262421;border-radius:12px;padding:3px 10px">${t}</span>`).join('')}</div>`);
    // The podium as it is.
    crop(p, S, 0, 222, 412, 256, 0, 236);
    // The rest of the top ten in one card, a hairline between.
    const rows = [[4, 'cardio_hater', 11, 'Silver I', 38, 533], [5, 'delt_destroyer', 10, 'Silver III', 33, 619], [6, 'plank_ninja', 14, 'Gold V', 30, 705]];
    const g = el(p, Object.assign({ left: '16px', right: '16px', top: '500px', height: rows.length * 64 + 'px' }, card));
    rows.forEach(([pl, name, l, tier, pts, cy], i) => {
      const y = 500 + i * 64;
      el(p, { left: '30px', top: (y + 22) + 'px', width: '20px', textAlign: 'center', fontSize: '14px', fontWeight: 700, color: MUTED }, pl);
      crop(p, S, 69, cy - 24, 74, 48, 58, y + 8, true);
      el(p, { left: '140px', top: (y + 12) + 'px' }, `<div style="font-size:15.5px;font-weight:600;display:flex;gap:6px;align-items:center">${name} ${lv(l)}</div><div style="font-size:12.5px;color:${MUTED};margin-top:2px">${tier}</div>`);
      el(p, { right: '30px', top: (y + 13) + 'px', textAlign: 'right' }, `<div class="num" style="font-size:18px;font-weight:700">${pts}</div><div style="font-size:11px;color:${MUTED}">pts</div>`);
      if (i > 0) el(g, { left: '124px', right: 0, top: (i * 64) + 'px', height: '1px', background: 'rgba(255,255,255,.07)' });
    });
    // You, pinned.
    el(p, Object.assign({ left: '16px', right: '16px', top: '740px', height: '74px' }, card, { border: '1.5px solid #E8DCC8' }));
    el(p, { left: '30px', top: '766px', width: '20px', textAlign: 'center', fontSize: '14px', fontWeight: 700, color: MUTED }, '12');
    crop(p, S, 26, 833, 80, 48, 56, 753, true);
    el(p, { left: '140px', top: '757px' }, `<div style="font-size:15.5px;font-weight:600;display:flex;gap:6px;align-items:center">demo_lifter ${lv(12)} <span style="font-size:11px;font-weight:700;background:#E8DCC8;color:#141210;border-radius:6px;padding:1px 6px">YOU</span></div><div style="font-size:12.5px;color:${MUTED};margin-top:2px">6 pts to the top 10</div>`);
    el(p, { right: '30px', top: '760px', textAlign: 'right' }, `<div class="num" style="font-size:18px;font-weight:700">37</div><div style="font-size:11px;color:${MUTED}">pts</div>`);
  }

  function profile(p) {
    const S = 'now/tab_profile.png';
    // The top as it is: the icons, the picture, the name, the code.
    crop(p, S, 0, 0, 412, 206, 0, 0);
    // The rank card as built, out of the shot.
    crop(p, S, 0, 220, 412, 118, 0, 212);
    // Level: one quiet line and a bar.
    el(p, Object.assign({ left: '16px', right: '16px', top: '338px', height: '82px', padding: '14px 16px' }, card),
      `<div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-size:17px;font-weight:700">Level 12</div><div class="num" style="font-size:13px;color:${MUTED}">390 / 650 XP</div></div>
       <div style="height:6px;border-radius:3px;background:#262421;margin-top:10px;overflow:hidden"><div style="width:60%;height:100%;background:#E8DCC8;border-radius:3px"></div></div>
       <div style="font-size:12px;color:${MUTED};margin-top:6px">260 XP to Level 13</div>`);
    // The six numbers in one card, a hairline grid between them.
    const stats = [['Global', '#1,842'], ['United States', '#64'], ['Best set', '24'], ['Total reps', '412'], ['Record', '18–9'], ['Streak', '0 d']];
    const g = el(p, Object.assign({ left: '16px', right: '16px', top: '426px', height: '186px' }, card));
    stats.forEach(([label, v], i) => {
      const col = i % 3, row = Math.floor(i / 3);
      el(g, { left: (col * 126.7 + 14) + 'px', top: (row * 93 + 18) + 'px', width: '110px' }, `<div style="font-size:12px;color:${MUTED};font-weight:600">${label}</div><div class="num" style="font-size:22px;font-weight:700;margin-top:4px">${v}</div>`);
    });
    el(g, { left: '14px', right: '14px', top: '93px', height: '1px', background: 'rgba(255,255,255,.07)' });
    el(g, { left: '126.7px', top: '14px', bottom: '14px', width: '1px', background: 'rgba(255,255,255,.07)' });
    el(g, { left: '253.4px', top: '14px', bottom: '14px', width: '1px', background: 'rgba(255,255,255,.07)' });
    // The week, as a quiet row of days.
    el(p, { left: '20px', top: '628px', fontSize: '14px', fontWeight: 600, color: MUTED }, 'Last 7 days');
    el(p, Object.assign({ left: '16px', right: '16px', top: '652px', height: '78px', padding: '14px 16px', display: 'flex', alignItems: 'flex-end', gap: '8px' }, card),
      ['T', 'W', 'T', 'F', 'S', 'S', 'M'].map((d, i) => `<div style="flex:1;text-align:center"><div style="height:${[0, 0, 0, 0, 0, 0, 6][i] || 4}px;border-radius:3px;background:${i === 6 ? '#E8DCC8' : '#262421'}"></div><div style="font-size:11px;color:${MUTED};margin-top:6px">${d}</div></div>`).join(''));
    el(p, { left: '20px', right: '20px', top: '748px', display: 'flex', justifyContent: 'space-between' }, `<div style="font-size:14px;font-weight:600;color:${MUTED}">Recent</div><div style="font-size:14px;color:#E8DCC8;font-weight:600">View all</div>`);
  }

  const pages = {
    ranks: ['١. الرانكات', 'التابات الـ3 فوق بقت شريط واحد زي الويك/الشهر، والمراكز من الرابع ورايح في كارت واحد بخط رفيع بين كل واحد (زي الأصحاب). البوديوم وكارت "أنت" زي ما هم. شريط التابات تحت زي ما هو بالظبط.', ranks, 'tab_ranks_month'],
    profile: ['٢. البروفايل', 'كارت الرتبة زي ما اتعمل، والليفل في كارت أهدى، والـ6 أرقام (المركز، أحسن ست، العدّات، الريكورد، السلسلة) في كارت واحد مقسوم بخطوط بدل 6 كروت، والأسبوع أبسط. شريط التابات تحت زي ما هو.', profile, 'tab_profile'],
  };
  const [title, sub, draw, shot] = pages[page];
  document.getElementById('title').textContent = title;
  document.getElementById('sub').textContent = sub;
  document.getElementById('now').innerHTML = `<img class="shot" src="now/${shot}.png">`;
  draw(document.getElementById('pb'));
</script>
</body>
</html>
