<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Simpler Ranks</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #070605; color: #F5EFE4; font-family: 'Noto Sans', sans-serif; }
  .wrap { padding: 22px 24px 30px; width: 1000px; }
  .cap { direction: rtl; font-family: 'Noto Sans Arabic', 'Noto Sans', sans-serif; margin-bottom: 12px; }
  .cap b { display: block; font-size: 22px; margin-bottom: 6px; }
  .cap p { margin: 0; color: #8F8880; font-size: 15px; line-height: 1.7; }
  .row { display: flex; gap: 40px; justify-content: center; }
  .lab { direction: rtl; font-family: 'Noto Sans Arabic', sans-serif; text-align: center; font-size: 18px; margin-bottom: 8px; color: #8F8880; }
  .lab.b { color: #E8DCC8; font-weight: 700; }
  .phone { position: relative; width: 412px; height: 915px; border-radius: 30px; overflow: hidden; outline: 1px solid #2a2724; background: #111010; flex: none; }
  .phone img.shot { position: absolute; inset: 0; width: 412px; height: 915px; }
  .crop { position: absolute; background-repeat: no-repeat; }
  .abs { position: absolute; }
  .num { font-variant-numeric: tabular-nums; }
</style>
</head>
<body data-p="a">
<div class="wrap">
  <div class="cap"><b id="title"></b><p id="sub"></p></div>
  <div class="row">
    <div><div class="lab">دلوقتي</div><div class="phone" id="now"></div></div>
    <div><div class="lab b" id="optlab"></div><div class="phone" id="opt"></div></div>
  </div>
</div>
<script>
  const page = document.body.dataset.p;
  const MUTED = 'rgba(245,239,228,.5)', CREAM = '#E8DCC8', GOLD = '#D9A94A', SURF = '#1A1918', RAISED = '#262421', LINE = 'rgba(255,255,255,.07)';
  const el = (p, css, html) => { const d = document.createElement('div'); d.className = 'abs'; Object.assign(d.style, css); if (html != null) d.innerHTML = html; p.appendChild(d); return d; };
  // A piece of a 412x915 shot, at scale s.
  const crop = (p, src, x0, y0, w, h, x, y, s = 1) => { const d = el(p, { left: x + 'px', top: y + 'px', width: w * s + 'px', height: h * s + 'px', backgroundImage: `url(${src})`, backgroundSize: `${412 * s}px ${915 * s}px`, backgroundPosition: `${-x0 * s}px ${-y0 * s}px`, mixBlendMode: 'lighten' }); d.className = 'crop'; return d; };
  const card = { background: SURF, borderRadius: '16px' };
  const lv = (n) => `<span style="font-size:11px;font-weight:700;color:rgba(245,239,228,.6);background:${RAISED};border-radius:6px;padding:1px 6px">Lv ${n}</span>`;
  const globe = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="${CREAM}" stroke-width="2"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c3 3.2 3 15.8 0 19M12 2.5c-3 3.2-3 15.8 0 19"/></svg>`;
  const caret = `<svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" stroke="${MUTED}" stroke-width="1.6" fill="none"/></svg>`;
  const info = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="${CREAM}" stroke-width="2"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.2v.2"/></svg>`;
  const chev = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${MUTED}" stroke-width="2.2"><path d="M9 5l7 7-7 7"/></svg>`;
  const segmented = (p, top, items, on, h = 44) => el(p, Object.assign({ left: '16px', right: '16px', top: top + 'px', height: h + 'px', padding: '4px', display: 'flex', gap: '4px' }, card, { borderRadius: '14px' }),
    items.map((t, i) => `<div style="flex:1;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:14.5px;font-weight:${i === on ? 700 : 500};${i === on ? `background:${CREAM};color:#141210` : 'color:rgba(245,239,228,.55)'}">${t}</div>`).join(''));
  const titleRow = (p) => {
    el(p, { left: '20px', top: '18px', fontSize: '28px', fontWeight: 700 }, 'Ranks');
    el(p, Object.assign({ right: '16px', top: '22px', height: '34px', padding: '0 12px', display: 'flex', alignItems: 'center', gap: '7px', fontSize: '13.5px', fontWeight: 600 }, card, { borderRadius: '12px' }), `${globe} Global ${caret}`);
  };
  const M = 'now/tab_ranks_month.png', T = 'now/tab_ranks_top.png', H = 'now/tab_shell_match.png';
  // Avatars with their tier frames, out of the shots: [shot, centre y].
  const AV = { cardio: [M, 533], delt: [M, 619], plank: [M, 705], rep: [M, 791], newbie: [T, 603], iron: [T, 173], squat: [T, 259], bench: [T, 345], me: [M, 857] };
  const avatar = (p, who, x, y) => { const [src, cy] = AV[who]; crop(p, src, who === 'me' ? 26 : 69, cy - 24, who === 'me' ? 80 : 74, 48, x, y); };
  const medal = { 1: GOLD, 2: '#A9A39A', 3: '#B87A4E' };
  // A board's rows in one card, a hairline between.
  function rows(p, top, list, unit) {
    el(p, Object.assign({ left: '16px', right: '16px', top: top + 'px', height: list.length * 64 + 'px' }, card));
    list.forEach(([pl, who, name, l, sub, pts], i) => {
      const y = top + i * 64;
      el(p, Object.assign({ left: '27px', top: (y + 17) + 'px', width: '30px', height: '30px', borderRadius: '15px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '14px', fontWeight: 700 }, medal[pl] ? { background: medal[pl], color: '#141210' } : { color: MUTED }), pl);
      avatar(p, who, 58, y + 8);
      el(p, { left: '140px', top: (y + 12) + 'px' }, `<div style="font-size:15.5px;font-weight:600;display:flex;gap:6px;align-items:center">${name} ${lv(l)}</div><div style="font-size:12.5px;color:${MUTED};margin-top:2px">${sub}</div>`);
      el(p, { right: '30px', top: (y + 13) + 'px', textAlign: 'right' }, `<div class="num" style="font-size:17px;font-weight:700">${pts}</div><div style="font-size:11px;color:${MUTED}">${unit}</div>`);
      if (i > 0) el(p, { left: '121px', right: '16px', top: y + 'px', height: '1px', background: LINE });
    });
  }
  const pinnedMe = (p, top, place, hint, pts, unit) => {
    el(p, Object.assign({ left: '16px', right: '16px', top: top + 'px', height: '78px' }, card, { border: `1.5px solid ${CREAM}` }));
    el(p, { left: '28px', top: (top + 28) + 'px', width: '30px', textAlign: 'center', fontSize: '14px', fontWeight: 700, color: MUTED }, place);
    avatar(p, 'me', 54, top + 15);
    el(p, { left: '140px', top: (top + 17) + 'px', right: '80px' }, `<div style="font-size:15.5px;font-weight:600;display:flex;gap:6px;align-items:center">demo_lifter ${lv(12)} <span style="font-size:11px;font-weight:700;background:${CREAM};color:#141210;border-radius:6px;padding:1px 6px">YOU</span></div><div style="font-size:12.5px;color:${MUTED};margin-top:2px">${hint}</div>`);
    el(p, { right: '30px', top: (top + 20) + 'px', textAlign: 'right' }, `<div class="num" style="font-size:17px;font-weight:700;color:${CREAM}">${pts}</div><div style="font-size:11px;color:${MUTED}">${unit}</div>`);
  };
  const week = [[4, 'cardio', 'cardio_hater', 11, 'Silver I', 117], [5, 'delt', 'delt_destroyer', 10, 'Silver III', 109], [6, 'plank', 'plank_ninja', 14, 'Gold V', 104], [7, 'rep', 'rep_machine', 9, 'Silver IV', 101], [8, 'newbie', 'newbie_gains', 5, 'Bronze III', 96]];
  const top3 = [[1, 'squat', 'squat_queen', 19, 'Platinum II', 142], [2, 'iron', 'iron_mike', 22, 'Diamond IV', 131], [3, 'bench', 'benchgod', 15, 'Gold III', 124]];

  // A: everything on one strip; the place and the rules step aside.
  function optA(p) {
    titleRow(p);
    segmented(p, 72, ['Week', 'Month', 'Overall'], 0);
    el(p, { left: '20px', top: '130px', fontSize: '14px', color: MUTED }, 'Ends in 6d 20h');
    el(p, { right: '20px', top: '128px', display: 'flex', gap: '6px', alignItems: 'center', fontSize: '14px', fontWeight: 600, color: CREAM }, `${info} How points work`);
    crop(p, M, 0, 228, 412, 252, 0, 162);
    rows(p, 432, week, 'pts');
    pinnedMe(p, 820, 14, '39 pts to the top 3', 86, 'pts');
  }

  // B: your place first, then the board; no podium, no pinned row.
  function optB(p) {
    titleRow(p);
    segmented(p, 72, ['Week', 'Month', 'Overall'], 0);
    const y = 130;
    el(p, Object.assign({ left: '16px', right: '16px', top: y + 'px', height: '132px' }, card, { border: `1.5px solid ${CREAM}` }));
    avatar(p, 'me', 26, y + 20);
    el(p, { left: '112px', top: (y + 16) + 'px' }, `<div style="font-size:13px;color:${MUTED};font-weight:600">Your place this week</div><div style="display:flex;align-items:baseline;gap:10px;margin-top:2px"><span class="num" style="font-size:40px;font-weight:800;color:${GOLD};line-height:1.05">#14</span><span class="num" style="font-size:16px;font-weight:700">86 pts</span></div>`);
    el(p, { left: '32px', right: '32px', top: (y + 88) + 'px', height: '6px', borderRadius: '3px', background: RAISED, overflow: 'hidden' }, `<div style="width:69%;height:100%;background:${CREAM}"></div>`);
    el(p, { left: '32px', right: '32px', top: (y + 100) + 'px', display: 'flex', justifyContent: 'space-between', fontSize: '12.5px', color: MUTED }, `<span>39 pts to the top 3</span><span>Ends in 6d 20h</span>`);
    el(p, { left: '20px', top: '282px', fontSize: '14px', fontWeight: 600, color: MUTED }, 'Top this week');
    el(p, { right: '20px', top: '280px', display: 'flex', gap: '6px', alignItems: 'center', fontSize: '14px', fontWeight: 600, color: CREAM }, `${info} How points work`);
    rows(p, 310, top3.concat(week), 'pts');
  }

  // C: three cards, one for each board; a tap opens the board.
  function optC(p) {
    titleRow(p);
    const tile = (y, h, label, html) => {
      el(p, Object.assign({ left: '16px', right: '16px', top: y + 'px', height: h + 'px' }, card));
      el(p, { left: '32px', top: (y + 16) + 'px', fontSize: '13px', fontWeight: 600, color: MUTED }, label);
      el(p, { right: '28px', top: (y + h / 2 - 8) + 'px' }, chev);
      el(p, { left: '32px', top: (y + 38) + 'px', right: '48px' }, html);
    };
    tile(76, 128, 'This week', `<div style="display:flex;align-items:baseline;gap:10px"><span class="num" style="font-size:40px;font-weight:800;color:${GOLD};line-height:1.05">#14</span><span class="num" style="font-size:16px;font-weight:700">86 pts</span></div><div style="font-size:13px;color:${MUTED};margin-top:6px">39 pts to the top 3 · ends in 6d 20h</div>`);
    // The week's top three, small, beside the place.
    [['squat', 0], ['iron', 1], ['bench', 2]].forEach(([w, i]) => crop(p, AV[w][0], 69 + 13, AV[w][1] - 24, 48, 48, 228 + i * 34, 112, 0.92));
    tile(216, 128, 'This month', `<div style="display:flex;align-items:baseline;gap:10px"><span class="num" style="font-size:40px;font-weight:800;color:${GOLD};line-height:1.05">#22</span><span class="num" style="font-size:16px;font-weight:700">61 pts</span></div><div style="font-size:13px;color:${MUTED};margin-top:6px">14 pts to the top 10 · ends in 28d</div>`);
    tile(356, 128, 'Rating', `<div style="display:flex;align-items:baseline;gap:10px"><span class="num" style="font-size:40px;font-weight:800;line-height:1.05">2,764</span><span style="font-size:16px;font-weight:700">Gold III</span></div><div style="font-size:13px;color:${MUTED};margin-top:6px">#1,842 in the world · 36 to Gold II</div>`);
    crop(p, H, 100, 128, 212, 120, 236, 392, 0.55);
    el(p, Object.assign({ left: '16px', right: '16px', top: '500px', height: '56px', display: 'flex', alignItems: 'center', gap: '10px', padding: '0 16px', fontSize: '15px', fontWeight: 600 }, card), `${info}<span style="flex:1">How points work</span>${chev}`);
  }

  const pages = {
    a: ['A · شريط واحد', 'بدل 3 تابات + أسبوع/شهر + العالم/البلد فوق بعض: شريط واحد بس (الأسبوع · الشهر · العام)، والعالم/البلد زرار صغير جنب العنوان، وقواعد النقط في زرار "How points work" بيفتح شرح. "Your Tier" بيتشال، ومكانك في العام بيبان في الكارت اللي تحت.', optA, 'ranks_b', 'A · شريط واحد'],
    b: ['B · إنت الأول', 'نفس الشريط الواحد، بس أول حاجة تحته هي مكانك إنت: رقمك ونقطك وفاضلك قد إيه للتوب 3. بعدها الترتيب من الأول للآخر في كارت واحد، من غير البوديوم الكبير ومن غير كارت "أنت" تحت.', optB, 'ranks_b', 'B · إنت الأول'],
    c: ['C · 3 كروت', 'أول ما تدخل تلاقي 3 كروت بس: الأسبوع (مكانك ونقطك)، الشهر (مكانك ونقطك)، والتقييم (رقمك ورتبتك ومكانك في العالم). تدوس على أي كارت يفتحلك الترتيب بتاعه كامل. وقواعد النقط في زرار لوحده.', optC, 'ranks_b', 'C · 3 كروت'],
  };
  const [title, sub, draw, shot, lab] = pages[page];
  document.getElementById('title').textContent = title;
  document.getElementById('sub').textContent = sub;
  document.getElementById('optlab').textContent = lab;
  document.getElementById('now').innerHTML = `<img class="shot" src="now/${shot}.png">`;
  draw(document.getElementById('opt'));
</script>
</body>
</html>
