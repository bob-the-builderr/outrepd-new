<html>

<body>

</helmet>
<div style="width: 390px; height: 844px; background: #010308; color: #ffffff; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 18px 16px 0; display: flex; flex-direction: column; align-items: center; gap: 14px">

    <div style="width: 100%; display: flex; align-items: stretch; gap: 10px">

        <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #4BB8FA">You</div>
        <div style="font-size: 44px; font-weight: 900; letter-spacing: -1.8px; font-variant-numeric: tabular-nums; line-height: 1">42</div>
      </div>
      <div style="display: flex; align-items: center">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 1.2px; color: #556070">VS</span>
      </div>
      <div style="flex-grow: 1; background: #0D1218; border: 1px solid #1A2630; border-radius: 16px; padding: 14px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #556070">PR_HUNTER</div>

      </div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px; gap: 16px">
    <div style="background: rgba(255,68,68,0.15); border-radius: 20px; padding: 6px 14px">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #FF4444">Their pick</span>

    <div style="font-size: 26px; font-weight: 900; letter-spacing: -0.6px; text-align: center; text-wrap: balance; line-height: 1.15">Incline Dumbbell Press</div>

    <div style="display: flex; align-items: baseline; gap: 5px">
      <span style="font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.4px">90</span>
      <span style="font-size: 13px; font-weight: 600; color: #556070">seconds of work</span>
    </div>

    <div style="width: 100%; background: #4BB8FA; border-radius: 16px; padding: 17px; display: flex; align-items: center; justify-content: center; gap: 9px; margin-top: 8px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="#ffffff"><path d="M8 5v14l11-7z"></path></svg>
      <span style="font-size: 18px; font-weight: 800; letter-spacing: -0.2px; color: #ffffff">Start</span>
    </div>
  </div>

  <div style="padding: 0 16px 20px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 9px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#22C55E"><circle cx="12" cy="12" r="10"></circle><path d="M8 12.5l2.6 2.6L16 9.6" stroke="#010308" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>

      <span style="font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums">16</span>
    </div>
    <div style="display: flex; align-items: center; gap: 9px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#22C55E"><circle cx="12" cy="12" r="10"></circle><path d="M8 12.5l2.6 2.6L16 9.6" stroke="#010308" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="font-size: 13px; font-weight: 500; flex-grow: 1">Cable Front Raises</span>
      <span style="font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums">26</span>
    </div>
    <div style="display: flex; align-items: center; gap: 9px; padding: 6px 8px; margin: -6px -8px; background: rgba(75,184,250,0.10); border-radius: 10px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4BB8FA" stroke-width="2.4"><circle cx="12" cy="12" r="9"></circle></svg>
      <span style="font-size: 13px; font-weight: 700; flex-grow: 1; color: #4BB8FA">Incline Dumbbell Press</span>
    </div>
    <div style="display: flex; align-items: center; gap: 9px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1A2630" stroke-width="2.4"><circle cx="12" cy="12" r="9"></circle></svg>
      <span style="font-size: 13px; font-weight: 500; color: #556070; flex-grow: 1">Overhead Press</span>
    </div>
    <div style="display: flex; align-items: center; gap: 9px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1A2630" stroke-width="2.4"><circle cx="12" cy="12" r="9"></circle></svg>
      <span style="font-size: 13px; font-weight: 500; color: #556070; flex-grow: 1">Dumbbell Flyes</span>
    </div>
    <div style="display: flex; align-items: center; gap: 9px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1A2630" stroke-width="2.4"><circle cx="12" cy="12" r="9"></circle></svg>
      <span style="font-size: 13px; font-weight: 500; color: #556070; flex-grow: 1">Cable Tricep Pushdown</span>
    </div>
  </div>

</div>
