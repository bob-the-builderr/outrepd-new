name: promo_recorder
description: "Films the promo app itself, at the phone's full resolution, into Photos."
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.12.2
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: PromoRecorderPlugin
