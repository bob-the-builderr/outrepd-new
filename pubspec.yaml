name: outrepd_promo
description: "OUTREPD Promo Studio: the match screen, staged, for filming."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# The app's own packages for the match screen, at the app's own versions
# (pubspec.lock is the app's), and nothing that reaches a server: no
# Supabase, no Firebase, no purchases, no Health.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  camera: ^0.12.0+2
  permission_handler: ^12.0.0
  google_mlkit_pose_detection: ^0.15.0
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  intl: ^0.20.2
  clock: ^1.1.2
  wakelock_plus: ^1.8.0
  audioplayers: ^6.5.0
  # Films the take itself into Photos (packages/promo_recorder).
  promo_recorder:
    path: packages/promo_recorder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
